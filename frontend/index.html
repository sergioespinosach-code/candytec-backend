  const clientesData=CLIENTES.map(c=>({
    'Nombre':c.nombre,'RUC':c.ruc,'Correo':c.correo,'Teléfono':c.telefono,
    'Ciudad':c.ciudad,'Provincia':c.provincia,'Dirección':c.direccion,'Creado por':c.creadoPor,'Meta anual':c.objetivo,
  }));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(clientesData),'Clientes');

  const invData=INVENTARIO.map(i=>({
    'Tipo':i.tipo==='materia_prima'?'Materia prima':'Producto terminado','Nombre':i.nombre,'Unidad':i.unidad,
    'Stock':i.stock,'Stock mínimo':i.minimo,'Costo promedio':i.costoProm||'',
  }));

  const movData=MOVIMIENTOS.map(m=>{
    const it=INVENTARIO.find(x=>x.id===m.itemId);

  });
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(movData),'Movimientos');

  }));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(prodData),'Producción');

  XLSX.writeFile(wb,'CandyTec_Datos_Completos_'+hoyStr().replace(/\//g,'-')+'.xlsx');
  toast('Excel descargado con todos los datos');
}

/* ============================================================
   INFORME PDF CON ANÁLISIS — cálculo de métricas (testeable aparte del render)
   ============================================================ */
function computeReportMetrics(desde,hasta){
  const desdeTs=desde?new Date(desde+'T00:00:00').getTime():-Infinity;
  const hastaTs=hasta?new Date(hasta+'T23:59:59').getTime():Infinity;
  const enRango=(o)=>{const f=parseFecha(o.fechaOrden); return f!==null&&f>=desdeTs&&f<=hastaTs;};
  const pedidosPeriodo=ORDERS.filter(o=>o.factura&&enRango(o));

  const diasPeriodo=Math.max(1,Math.round((hastaTs-desdeTs)/86400000));
  const desdeAntTs=desdeTs-diasPeriodo*86400000;
  const hastaAntTs=desdeTs-1;
  const enRangoAnt=(o)=>{const f=parseFecha(o.fechaOrden); return f!==null&&f>=desdeAntTs&&f<=hastaAntTs;};
  const pedidosAnterior=ORDERS.filter(o=>o.factura&&enRangoAnt(o));

  const sum=(list,fn)=>list.reduce((a,o)=>a+fn(o),0);
  const ventasPeriodo=sum(pedidosPeriodo,o=>valorFacturadoConIva(o));
  const ventasAnterior=sum(pedidosAnterior,o=>valorFacturadoConIva(o));
  const crecimiento=ventasAnterior>0?((ventasPeriodo-ventasAnterior)/ventasAnterior*100):(ventasPeriodo>0?100:0);
  const ticketPeriodo=pedidosPeriodo.length?ventasPeriodo/pedidosPeriodo.length:0;

  const topBy=(fn)=>{const m={};pedidosPeriodo.forEach(o=>{const k=fn(o);if(!k)return;m[k]=(m[k]||0)+valorFacturadoConIva(o);});return Object.entries(m).sort((a,b)=>b[1]-a[1]);};
  const topProductos=(()=>{const m={};pedidosPeriodo.forEach(o=>itemsFacturadosPedido(o).forEach(p=>{m[p.name]=(m[p.name]||0)+p.qty*p.price;}));return Object.entries(m).sort((a,b)=>b[1]-a[1]);})();
  const topVendedores=topBy(o=>o.vendedor);
  const topClientes=topBy(o=>o.client);
  const topCiudades=topBy(o=>o.ciudad);

  const conPago=ORDERS.filter(o=>o.pago);
  const carteraTotal=sum(conPago,o=>o.pago.saldo);
  const carteraVencida=sum(conPago.filter(pagoVencido),o=>o.pago.saldo);
  const pctVencida=carteraTotal>0?(carteraVencida/carteraTotal*100):0;

  const clientesConMeta=CLIENTES.filter(c=>c.objetivo>0);
  const clientesQueCumplieron=clientesConMeta.filter(c=>ventasAnualesCliente(c.ruc)>=c.objetivo);

  const bajoMinimo=INVENTARIO.filter(i=>i.stock<i.minimo);
  const concentracionVendedor=topVendedores.length&&ventasPeriodo>0?(topVendedores[0][1]/ventasPeriodo*100):0;
  const concentracionCliente=topClientes.length&&ventasPeriodo>0?(topClientes[0][1]/ventasPeriodo*100):0;

  const porEstado={};
  ORDERS.forEach(o=>{porEstado[o.state]=(porEstado[o.state]||0)+1;});

  return {desde,hasta,diasPeriodo,pedidosPeriodo,ventasPeriodo,ventasAnterior,crecimiento,ticketPeriodo,
    topProductos,topVendedores,topClientes,topCiudades,carteraTotal,carteraVencida,pctVencida,
    clientesConMeta,clientesQueCumplieron,bajoMinimo,concentracionVendedor,concentracionCliente,porEstado};
}
function generarConclusiones(m){
  const conclusiones=[], recomendaciones=[];
  if(m.ventasAnterior>0){
    if(m.crecimiento>=10) conclusiones.push(`Las ventas del período crecieron ${m.crecimiento.toFixed(1)}% frente al período anterior de igual duración — una tendencia positiva.`);
    else if(m.crecimiento<=-10){
      conclusiones.push(`Las ventas del período cayeron ${Math.abs(m.crecimiento).toFixed(1)}% frente al período anterior — merece atención.`);
      recomendaciones.push('Revisar con el equipo de ventas qué causó la caída: menos pedidos, tickets más bajos, o clientes que dejaron de comprar.');
    }else conclusiones.push(`Las ventas del período se mantuvieron relativamente estables (${m.crecimiento>=0?'+':''}${m.crecimiento.toFixed(1)}%) frente al período anterior.`);
  }else if(m.ventasPeriodo>0){
    conclusiones.push('No hay datos del período anterior para comparar, pero sí hubo ventas en el período seleccionado.');
  }
  if(m.concentracionVendedor>=50&&m.topVendedores.length){
    conclusiones.push(`${m.topVendedores[0][0]} concentra el ${m.concentracionVendedor.toFixed(0)}% de las ventas del período — hay dependencia alta de un solo vendedor.`);
    recomendaciones.push('Buscar formas de nivelar la carga comercial entre el equipo de ventas, o replicar con el resto del equipo lo que está funcionando bien con ese vendedor.');
  }
  if(m.concentracionCliente>=30&&m.topClientes.length){
    conclusiones.push(`${m.topClientes[0][0]} representa el ${m.concentracionCliente.toFixed(0)}% de las ventas del período — riesgo de depender demasiado de un solo cliente.`);
    recomendaciones.push('Diversificar la cartera de clientes activos para reducir el riesgo si ese cliente reduce sus compras.');
  }
  if(m.pctVencida>=20){
    conclusiones.push(`La cartera vencida representa el ${m.pctVencida.toFixed(0)}% del total por cobrar (${money(m.carteraVencida)}) — un nivel alto.`);
    recomendaciones.push('Priorizar la gestión de cobranza de las facturas vencidas antes de seguir ampliando crédito a esos clientes.');
  }else if(m.pctVencida>0){
    conclusiones.push(`La cartera vencida es del ${m.pctVencida.toFixed(0)}% del total por cobrar — un nivel manejable.`);
  }else if(m.carteraTotal>0){
    conclusiones.push('No hay cartera vencida actualmente — la cobranza está al día.');
  }
  if(m.clientesConMeta.length>0){
    const pct=(m.clientesQueCumplieron.length/m.clientesConMeta.length*100);
    if(pct<50){
      conclusiones.push(`Solo el ${pct.toFixed(0)}% de los clientes con meta anual la están cumpliendo (${m.clientesQueCumplieron.length} de ${m.clientesConMeta.length}).`);
      recomendaciones.push('Revisar si las metas están bien calibradas, o si hace falta un seguimiento comercial más cercano a los clientes que no las están cumpliendo.');
    }else conclusiones.push(`El ${pct.toFixed(0)}% de los clientes con meta anual la están cumpliendo.`);
  }
  if(m.bajoMinimo.length>0){
    conclusiones.push(`Hay ${m.bajoMinimo.length} ítem(s) de inventario por debajo del stock mínimo.`);
    recomendaciones.push('Reabastecer pronto: '+m.bajoMinimo.slice(0,5).map(i=>i.nombre).join(', ')+(m.bajoMinimo.length>5?` y ${m.bajoMinimo.length-5} más`:'')+'.');
  }else{
    conclusiones.push('Todo el inventario está por encima de su stock mínimo.');
  }
  const atascados=(m.porEstado['POR_FACTURAR']||0)+(m.porEstado['POR_ENTREGAR']||0);
  if(atascados>5) recomendaciones.push(`Hay ${atascados} pedidos esperando ser facturados o despachados — conviene revisar si hay cuellos de botella en ese flujo.`);
  if(!conclusiones.length) conclusiones.push('No hay suficientes datos en el período seleccionado para generar conclusiones.');
  if(!recomendaciones.length) recomendaciones.push('No se detectaron alertas específicas — la operación luce estable en los indicadores analizados.');
  return {conclusiones,recomendaciones};
}
function generarInformePDF(){
  if(guardDouble('generarInformePDF',2000)) return;
  try{
    if(typeof window.jspdf==='undefined'){ toast('No se pudo cargar la librería de PDF — revisa tu conexión a internet'); return; }
    const desde=document.getElementById('rep_desde').value;
    const hasta=document.getElementById('rep_hasta').value;
    if(!desde||!hasta){ toast('Selecciona la fecha de inicio y de fin'); return; }
    if(desde>hasta){ toast('La fecha "desde" no puede ser posterior a "hasta"'); return; }

    const m=computeReportMetrics(desde,hasta);
    const {conclusiones,recomendaciones}=generarConclusiones(m);

    const {jsPDF}=window.jspdf;
    const doc=new jsPDF();
    let y=20;
    doc.setFontSize(18); doc.text('CandyTec — Informe de análisis',14,y); y+=8;
    doc.setFontSize(10); doc.setTextColor(120);
    doc.text(`Período: ${desde.split('-').reverse().join('/')} al ${hasta.split('-').reverse().join('/')} · Generado el ${hoyStr()}`,14,y); y+=10;
    doc.setTextColor(0);

    doc.setFontSize(13); doc.text('Resumen del período',14,y); y+=7;
    doc.autoTable({startY:y,head:[['Indicador','Valor']],body:[
      ['Ventas del período',money(m.ventasPeriodo)],
      ['Pedidos facturados',String(m.pedidosPeriodo.length)],
      ['Ticket promedio',money(m.ticketPeriodo)],
      ['Cambio vs período anterior',(m.crecimiento>=0?'+':'')+m.crecimiento.toFixed(1)+'%'],
      ['Cartera total por cobrar',money(m.carteraTotal)],
      ['Cartera vencida',money(m.carteraVencida)+' ('+m.pctVencida.toFixed(0)+'%)'],
    ],theme:'grid',styles:{fontSize:9}});
    y=doc.lastAutoTable.finalY+10;

    if(m.topProductos.length){
      doc.setFontSize(13); doc.text('Productos más vendidos',14,y); y+=7;
      doc.autoTable({startY:y,head:[['Producto','Ventas']],body:m.topProductos.slice(0,5).map(([n,v])=>[n,money(v)]),theme:'grid',styles:{fontSize:9}});
      y=doc.lastAutoTable.finalY+10;
    }
    if(y>230){ doc.addPage(); y=20; }
    if(m.topVendedores.length){
      doc.setFontSize(13); doc.text('Vendedores del período',14,y); y+=7;
      doc.autoTable({startY:y,head:[['Vendedor','Ventas']],body:m.topVendedores.slice(0,5).map(([n,v])=>[n,money(v)]),theme:'grid',styles:{fontSize:9}});
      y=doc.lastAutoTable.finalY+10;
    }
    if(y>220){ doc.addPage(); y=20; }

    doc.setFontSize(13); doc.text('Conclusiones',14,y); y+=8; doc.setFontSize(10);
    conclusiones.forEach(c=>{
      const lines=doc.splitTextToSize('• '+c,180);
      if(y+lines.length*5>280){ doc.addPage(); y=20; }
      doc.text(lines,14,y); y+=lines.length*5+3;
    });
    y+=5;
    if(y>260){ doc.addPage(); y=20; }
    doc.setFontSize(13); doc.text('Recomendaciones',14,y); y+=8; doc.setFontSize(10);
    recomendaciones.forEach(r=>{
      const lines=doc.splitTextToSize('• '+r,180);
      if(y+lines.length*5>280){ doc.addPage(); y=20; }
      doc.text(lines,14,y); y+=lines.length*5+3;
    });

    doc.save('CandyTec_Informe_'+desde+'_a_'+hasta+'.pdf');
    toast('Informe PDF descargado');
  }finally{ releaseGuard('generarInformePDF'); }
}

// pedidos que todavía tienen producto por facturar/fabricar: los nuevos sin facturar,
// y los parciales a los que aún les falta parte del pedido (sin importar en qué etapa vayan)
function pedidosPorFabricar(){
  return ORDERS.filter(o=>{
    if(o.state==='ENTREGADO'&&!esPedidoPorCompletar(o)) return false;
    if(tieneEntregas(o)) return (o.products||[]).some(p=>cantidadPendienteFacturar(o,p.name)>0.005);
    return o.state==='POR_FACTURAR';
  });
}
// cuánto falta realmente de cada producto en ese pedido (lo ya facturado no se vuelve a fabricar)
/* ============================================================
   REPARAR ENTREGA DAÑADA — solo gerente_proy. Corrige entregas cuyos items quedaron
   con un producto repetido (dato guardado por el bug de líneas duplicadas, ya corregido
   en el cálculo, pero que no repara datos que ya se guardaron mal antes del arreglo).
   Solo se permite mientras la entrega sigue "Por despachar" — así nunca se toca inventario
   que ya se movió.
   ============================================================ */
function itemsCorregidosEntrega(o,entregaIdx){
  const e=o.entregas[entregaIdx];
  const nombres=[...new Set(e.items.map(i=>i.name))];
  const otras=o.entregas.filter((x,i)=>i!==entregaIdx);
  return nombres.map(name=>{
    const totalPedido=(o.products||[]).filter(p=>p.name===name).reduce((a,p)=>a+p.qty,0);
    const cubiertoPorOtras=otras.reduce((sum,x)=>sum+x.items.filter(i=>i.name===name).reduce((a,i)=>a+i.qty,0),0);
    const qty=Math.max(0,+(totalPedido-cubiertoPorOtras).toFixed(2));
    return {name,qty};
  }).filter(x=>x.qty>0);
}
function openRepararEntrega(pedidoId,entregaIdx){

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:${yaDespachada?'18px':'0'}">
        <div>
          <div style="font-weight:700;font-size:12px;color:var(--bad-tx);margin-bottom:6px">ANTES (dañado)</div>
          ${antes.map(i=>`<div style="font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)">${i.name}: <b>${i.qty}</b></div>`).join('')}

          ${despues.map(i=>`<div style="font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)">${i.name}: <b>${i.qty}</b></div>`).join('')}

    </div>

async function confirmRepararEntrega(pedidoId,entregaIdx){
  if(guardDouble('confirmRepararEntrega')) return;
  try{
    if(currentRole!=='gerente_proy'){toast('Solo tú puedes corregir una entrega dañada');return;}
    const o=ORDERS.find(x=>x.id===pedidoId); if(!o) return;
    const e=o.entregas[entregaIdx];
    const yaDespachada=e.estado!=='POR_DESPACHAR';
    if(yaDespachada){
      const confirmInput=document.getElementById('rep_confirm');
      if(!confirmInput||confirmInput.value.trim()!=='CORREGIR'){toast('Escribe CORREGIR para confirmar');return;}
    }
    const antes=e.items;
    const antesTxt=antes.map(i=>i.name+': '+i.qty).join(', ');
    const despues=itemsCorregidosEntrega(o,entregaIdx);

    if(yaDespachada){
      const nombresAntes=[...new Set(antes.map(i=>i.name))];
      const devolucion=nombresAntes.map(name=>{
        const cantAntes=antes.filter(i=>i.name===name).reduce((a,i)=>a+i.qty,0);
        const cantDespues=(despues.find(i=>i.name===name)?.qty)||0;
        return {name,diff:+(cantAntes-cantDespues).toFixed(2)};
      }).filter(x=>x.diff>0.005);
      try{
        for(const d of devolucion){
          const inv=INVENTARIO.find(x=>x.tipo==='producto_terminado'&&x.nombre===d.name);
          if(!inv) continue;
          const nuevoStock=+(inv.stock+d.diff).toFixed(2);
          const fecha=new Date().toISOString();
          const movRow=await apiPost('/api/movimientos',{item_id:inv.id,tipo:'ajuste_alza',cantidad:d.diff,motivo:'Corrección de entrega dañada '+o.id+' (bug de líneas duplicadas, ya corregido) · devuelto por '+myName(),usuario:myName()+' · Gerente de Proyectos',fecha});
          await apiPut('/api/inventario/'+inv.id,{stock:nuevoStock});
          inv.stock=nuevoStock;
          MOVIMIENTOS.push(mapMovimiento(movRow));
        }
      }catch(err){ toast('No se pudo devolver el inventario: '+err.message); return; }
    }

    e.items=despues;
    const nota='Entrega '+(entregaIdx+1)+' corregida por '+myName()+': tenía ('+antesTxt+'), ahora ('+despues.map(i=>i.name+': '+i.qty).join(', ')+').'+(yaDespachada?' Se devolvió al inventario lo que se había descontado de más.':'')+' Dato dañado de antes de la corrección del sistema.';
    o.history.push({s:o.state,actor:myName()+' · Gerente de Proyectos',t:ahoraStr(),note:nota});
    syncPedido(o);
    closeModal();renderView();buildNav();
    toast('Entrega corregida'+(yaDespachada?' · inventario devuelto':''));
  }finally{ releaseGuard('confirmRepararEntrega'); }
}

  return (o.products||[]).filter(p=>p.name===nombre).reduce((a,p)=>a+p.qty,0);
}

function plTablaHTML(){
  const productos=CATALOGO_IDS.slice();
  const pesoDe=(nombre)=>{ const p=productos.find(x=>x.nombre===nombre); return p&&p.peso_bulto!=null?+p.peso_bulto:0; };
  const todosPendientes=pedidosPorFabricar();
  let pendientes=todosPendientes.slice();

  const q=plSearchQuery.trim().toLowerCase();
  if(q) pendientes=pendientes.filter(o=>o.client.toLowerCase().includes(q));
  if(plCiudadFiltro!=='todos') pendientes=pendientes.filter(o=>o.ciudad===plCiudadFiltro);
  if(plSectorFiltro!=='todos') pendientes=pendientes.filter(o=>{
    const c=CLIENTES.find(cl=>cl.ruc===o.ruc);
    return c&&c.sector===plSectorFiltro;
  });

  const conTons=pendientes.map(o=>{
    let tons=0, valor=0;
    const c=CLIENTES.find(cl=>cl.ruc===o.ruc);
    const nombresO=[...new Set((o.products||[]).map(p=>p.name))];
    const items=nombresO.map(name=>{
      const falta=faltantePorFabricar(o,name);
      const lineasProd=(o.products||[]).filter(p=>p.name===name);
      const qtyLineas=lineasProd.reduce((a,p)=>a+p.qty,0);
      const valLineas=lineasProd.reduce((a,p)=>a+p.qty*p.price,0);
      const precioProm=qtyLineas?valLineas/qtyLineas:0; // precio promedio si el mismo producto tiene líneas a distinto precio
      return {name,falta,precioProm};
    }).filter(x=>x.falta>0)
      .map(x=>{ tons+=x.falta*pesoDe(x.name)/1000; valor+=x.falta*x.precioProm; return `${x.name}: <b>${x.falta}</b>`; });
    return {o,c,tons,valor,items};
  });

  if(plSortMode==='fecha-asc') conTons.sort((a,b)=>(parseFecha(a.o.fechaEntrega)??Infinity)-(parseFecha(b.o.fechaEntrega)??Infinity));
  else if(plSortMode==='fecha-desc') conTons.sort((a,b)=>(parseFecha(b.o.fechaEntrega)??-Infinity)-(parseFecha(a.o.fechaEntrega)??-Infinity));
  else if(plSortMode==='ton-desc') conTons.sort((a,b)=>b.tons-a.tons);
  else if(plSortMode==='ton-asc') conTons.sort((a,b)=>a.tons-b.tons);
  else if(plSortMode==='cliente') conTons.sort((a,b)=>a.o.client.localeCompare(b.o.client,'es'));

  const totalTons=conTons.reduce((a,x)=>a+x.tons,0);
  const totalValor=conTons.reduce((a,x)=>a+x.valor,0);
  const todosLen=todosPendientes.length;

  const rows=conTons.map(({o,c,tons,valor,items})=>`<tr>
      <td>${o.client}<div style="font-size:11.5px;color:var(--muted)">${o.vendedor}</div></td>
      <td style="white-space:nowrap">${o.fechaEntrega||'—'}</td>
      <td>${o.ciudad||'—'}</td>
      <td>${o.direccionEntrega||'—'}</td>
      <td>${c&&c.sector?c.sector:'—'}</td>
      <td style="text-align:center">${items.length}</td>
      <td style="font-size:12.5px">${items.join('<br>')}</td>
      <td style="text-align:right;white-space:nowrap">${money(valor)}</td>
      <td style="text-align:right;font-weight:700;white-space:nowrap">${tons.toFixed(1)} ton</td>
    </tr>`).join('');

  return `<div class="sec-title">Pedidos con producto pendiente (${conTons.length}${conTons.length!==todosLen?' de '+todosLen:''}) · ${totalTons.toFixed(1)} ton. · ${money(totalValor)} pendientes</div>
    <div style="overflow-x:auto">
    <table class="ptable">
      <tr><th>Cliente</th><th>Fecha entrega</th><th>Ciudad</th><th>Dirección</th><th>Sector</th><th style="text-align:center">Ítems</th><th>Productos</th><th style="text-align:right">Valor pendiente</th><th style="text-align:right">Toneladas</th></tr>
      ${conTons.length?rows:`<tr><td colspan="9" style="color:var(--muted)">${todosLen?'Nada coincide con el filtro.':'No hay pedidos pendientes de facturar en este momento.'}</td></tr>`}
    </table></div>`;
}

/* ============================================================
   COSTOS LOGÍSTICOS — exclusivo de gerente_proy. Una fila por cada entrega ya

   Incluye tanto pedidos con entregas parciales como los "de una sola vez" (el
   flujo normal de toda la vida, que no pasa por el arreglo entregas).
   ============================================================ */
function clDataRows(){
  const filas=[];
  ORDERS.forEach(o=>{
    if(o.state!=='EN_TRANSITO'&&o.state!=='ENTREGADO'&&!tieneEntregas(o)) return;
    if(tieneEntregas(o)){
      (o.entregas||[]).forEach((e,i)=>{
        if(e.estado!=='EN_TRANSITO'&&e.estado!=='ENTREGADO') return;
        filas.push({
          pedidoId:o.id, entregaIdx:i, cliente:o.client, vendedor:o.vendedor, fecha:e.fecha,
          valor:valorEntrega(o,e), transporte:e.costoTransporte||0, estibaje:e.costoEstibaje||0,
        });
      });
    }else if(o.state==='EN_TRANSITO'||o.state==='ENTREGADO'){
      // pedido "de una sola entrega", el flujo normal que no usa el arreglo entregas
      const histDespacho=[...(o.history||[])].reverse().find(h=>h.s==='EN_TRANSITO');
      const fecha=histDespacho?histDespacho.t.split(' ')[0]:(o.fechaEntrega||'—');
      filas.push({
        pedidoId:o.id, entregaIdx:null, cliente:o.client, vendedor:o.vendedor, fecha,
        valor:valorFacturadoNeto(o), transporte:o.costoTransporte||0, estibaje:o.costoEstibaje||0,
      });
    }
  });
  return filas;
}

function clFilasFiltradas(){
  const todas=clDataRows();
  let filas=todas.slice();
  const q=clSearchQuery.trim().toLowerCase();
  if(q) filas=filas.filter(f=>f.cliente.toLowerCase().includes(q)||(f.vendedor||'').toLowerCase().includes(q));
  if(clDesde) filas=filas.filter(f=>{const t=parseFecha(f.fecha); return t===null||t>=new Date(clDesde+'T00:00:00').getTime();});
  if(clHasta) filas=filas.filter(f=>{const t=parseFecha(f.fecha); return t===null||t<=new Date(clHasta+'T23:59:59').getTime();});

  if(clSortMode==='fecha-desc') filas.sort((a,b)=>(parseFecha(b.fecha)??0)-(parseFecha(a.fecha)??0));
  else if(clSortMode==='fecha-asc') filas.sort((a,b)=>(parseFecha(a.fecha)??0)-(parseFecha(b.fecha)??0));
  else if(clSortMode==='valor-desc') filas.sort((a,b)=>b.valor-a.valor);
  else if(clSortMode==='valor-asc') filas.sort((a,b)=>a.valor-b.valor);
  else if(clSortMode==='pct-desc') filas.sort((a,b)=>{const pa=a.valor>0?(a.transporte+a.estibaje)/a.valor:0,pb=b.valor>0?(b.transporte+b.estibaje)/b.valor:0; return pb-pa;});
  else if(clSortMode==='sin-costo') filas.sort((a,b)=>((a.transporte+a.estibaje)>0?1:0)-((b.transporte+b.estibaje)>0?1:0));
  return {filas,todas};
}

async function guardarCostoEntrega(pedidoId,entregaIdx,campo,valor){
  if(currentRole!=='gerente_proy'){toast('Solo tú puedes registrar costos logísticos');return;}
  const o=ORDERS.find(x=>x.id===pedidoId); if(!o) return;
  const v=Math.max(0,parseFloat(valor)||0);
  if(entregaIdx==null||entregaIdx==='null'){
    // pedido de una sola entrega (sin arreglo entregas): el costo se guarda directo en el pedido
    if(campo==='transporte') o.costoTransporte=v; else o.costoEstibaje=v;
  }else{
    const e=o.entregas[entregaIdx]; if(!e) return;
    if(campo==='transporte') e.costoTransporte=v; else e.costoEstibaje=v;
  }
  syncPedido(o);
  clRefresh();
  const statsEl=document.getElementById('clStatsWrap'); if(statsEl) statsEl.innerHTML=clStatsHTML();
}

function viewProduccionLogistica(){
  const pendientes=pedidosPorFabricar();
  const productos=CATALOGO_IDS.slice().sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));

  pendientes.forEach(o=>{
    const nombresPedido=[...new Set((o.products||[]).map(p=>p.name))];
    nombresPedido.forEach(name=>{

  const inventarioActual={};
  productos.forEach(p=>{

      ${productos.map(p=>{

        </tr>`;
      }).join('')}

  return pageHead('Producción y logística','Todo lo que falta por fabricar y despachar · incluye pedidos nuevos y lo pendiente de los pedidos por completar')
  + `<div class="section-note"><span class="ni">◎</span><div>Muestra lo que <b>todavía falta por fabricar</b>: pedidos nuevos sin facturar, y la parte pendiente de los pedidos marcados POR COMPLETAR. Lo ya facturado desaparece de aquí porque su despacho ya quedó coordinado.</div></div>`
  + resumenHTML
  + plControlesHTML()
  + `<div id="plTablaWrap">${plTablaHTML()}</div>`;

function viewReportes(){
  const ventas=ORDERS.filter(o=>o.factura&&(o.subtotal||0)>0);
  const net=o=>valorFacturadoNeto(o);
  const ventasTotal=ventas.reduce((a,o)=>a+net(o),0);
  const cobrado=ventas.reduce((a,o)=>a+(o.pago?o.pago.cobrado:0),0);
  const porCobrar=ventas.reduce((a,o)=>a+(o.pago?o.pago.saldo:0),0);
  const ticket=ventas.length?ventasTotal/ventas.length:0;

  // metas ANUALES por cliente (valores meta) — configurable
  // (los objetivos ahora se leen directo de CLIENTES.objetivo, configurables desde la pestaña Clientes)

  // por producto
  const prod={};
  ventas.forEach(o=>itemsFacturadosPedido(o).forEach(p=>{const k=p.name;(prod[k]=prod[k]||{value:0,qty:0});prod[k].value+=p.qty*p.price;prod[k].qty+=p.qty;}));
  const prodRank=Object.entries(prod).sort((a,b)=>b[1].value-a[1].value);
  const prodMax=prodRank.length?prodRank[0][1].value:1;

  // por ciudad
  const ciu={}; ventas.forEach(o=>{const k=o.ciudad||'—';ciu[k]=(ciu[k]||0)+net(o);});
  const ciuRank=Object.entries(ciu).sort((a,b)=>b[1]-a[1]);
  const ciuMax=ciuRank.length?ciuRank[0][1]:1;

  // por vendedor
  const vend={}; ventas.forEach(o=>{vend[o.vendedor]=(vend[o.vendedor]||0)+net(o);});
  const vendRank=Object.entries(vend).sort((a,b)=>b[1]-a[1]);
  const vendMax=vendRank.length?vendRank[0][1]:1;

  // producto por vendedor + precio promedio por producto por vendedor
  const vp={}; ventas.forEach(o=>itemsFacturadosPedido(o).forEach(p=>{(vp[o.vendedor]=vp[o.vendedor]||{});(vp[o.vendedor][p.name]=vp[o.vendedor][p.name]||{value:0,qty:0});vp[o.vendedor][p.name].value+=p.qty*p.price;vp[o.vendedor][p.name].qty+=p.qty;}));

  // cobrado / por cobrar por vendedor
  const vc={}; ventas.forEach(o=>{(vc[o.vendedor]=vc[o.vendedor]||{cobrado:0,saldo:0});vc[o.vendedor].cobrado+=(o.pago?o.pago.cobrado:0);vc[o.vendedor].saldo+=(o.pago?o.pago.saldo:0);});

  // cumplimiento por cliente vs objetivo — solo clientes que existen actualmente (por RUC), con su meta real
  const cliRows=CLIENTES.map(c=>{const v=ventasAnualesCliente(c.ruc),ob=c.objetivo||0;return {c:c.nombre,v,ob,pct:ob?Math.round(v/ob*100):null};}).sort((a,b)=>b.v-a.v);

  const bar=(w,color)=>`<div class="rk-bar"><span style="width:${Math.max(2,w)}%;background:${color||''}"></span></div>`;
  const rankTable=(rows,max,fmt)=>`<table class="rank">${rows.map(([n,v],i)=>`<tr><td class="rk-pos">${i+1}</td><td><div class="rk-name">${n}</div>${bar(v/max*100)}</td><td class="rk-val">${fmt(v)}</td></tr>`).join('')}</table>`;

  return pageHead('Reportes y análisis','KPIs de gerencia en pantalla · el Excel es solo para llevarte los datos a profundidad')

  /* 1. VENTAS TOTALES */
  + `<div class="dash-section">

    <div class="stat-row">
      <div class="stat"><div class="sbar" style="background:var(--s-entregado)"></div><div class="sv">${money(ventasTotal)}</div><div class="sl">Ventas totales</div></div>
      <div class="stat"><div class="sbar" style="background:var(--s-listo)"></div><div class="sv">${money(cobrado)}</div><div class="sl">Valor cobrado</div></div>
      <div class="stat"><div class="sbar" style="background:var(--s-devuelto)"></div><div class="sv">${money(porCobrar)}</div><div class="sl">Valor por cobrar</div></div>
      <div class="stat"><div class="sbar" style="background:var(--s-bodega)"></div><div class="sv">${money(ticket)}</div><div class="sl">Ticket promedio</div></div>
    </div>
    <div class="panel" style="margin-top:16px">
      <h3>1.1 · Ventas por producto &nbsp;·&nbsp; 1.4 · Precio promedio por producto</h3>
      <table class="rank"><tr><th style="text-align:left;font-size:11px;color:var(--muted)">Producto</th><th style="font-size:11px;color:var(--muted)">Unidades</th><th style="font-size:11px;color:var(--muted)">Precio prom.</th><th style="font-size:11px;color:var(--muted);text-align:right">Ventas</th></tr>
        ${prodRank.map(([n,d])=>`<tr><td><div class="rk-name">${n}</div>${bar(d.value/prodMax*100)}</td><td style="text-align:center">${d.qty}</td><td style="text-align:center">${money(d.value/d.qty)}</td><td class="rk-val">${money(d.value)}</td></tr>`).join('')}

          <table class="rank"><tr><th style="text-align:left;font-size:11px;color:var(--muted)">Producto</th><th style="font-size:11px;color:var(--muted)">Unidades</th><th style="font-size:11px;color:var(--muted)">Precio prom.</th><th style="font-size:11px;color:var(--muted);text-align:right">Ventas</th></tr>
            ${Object.entries(vp[vn]||{}).sort((a,b)=>b[1].value-a[1].value).map(([pn,d])=>`<tr><td>${pn}</td><td style="text-align:center">${d.qty}</td><td style="text-align:center">${money(d.value/d.qty)}</td><td class="rk-val">${money(d.value)}</td></tr>`).join('')}
          </table>
        </div>`).join('')}
    </div>

    <div class="panel" style="margin-top:16px">
      <h3>3.4 · Valores cobrados y por cobrar por vendedor</h3>
      <table class="rank"><tr><th style="text-align:left;font-size:11px;color:var(--muted)">Vendedor</th><th style="font-size:11px;color:var(--muted);text-align:right">Cobrado</th><th style="font-size:11px;color:var(--muted);text-align:right">Por cobrar</th></tr>
        ${Object.entries(vc).sort((a,b)=>(b[1].cobrado+b[1].saldo)-(a[1].cobrado+a[1].saldo)).map(([vn,d])=>`<tr><td><div class="rk-name">${vn}</div></td><td class="rk-val" style="color:var(--ok-tx)">${money(d.cobrado)}</td><td class="rk-val" style="color:${d.saldo>0?'var(--bad-tx)':'var(--muted)'}">${money(d.saldo)}</td></tr>`).join('')}

    <div class="panel" style="margin-top:16px">

      <div style="margin-top:12px;font-size:12px;color:var(--muted)">Objetivo = meta de venta ANUAL configurada por cliente · se compara contra las ventas facturadas del año en curso.</div>

  /* EXPORTAR Y ANÁLISIS */
  + `<div class="dash-section">
    <div class="ds-head"><h2>Exportar y análisis</h2><span class="ds-sub">Descarga todos los datos, o pide un informe con conclusiones y recomendaciones</span></div>

async function confirmCambiarMiPassword(){
  if(guardDouble('confirmCambiarMiPassword')) return;
  try{
    const actual=document.getElementById('cmp_actual').value;
    const nueva=document.getElementById('cmp_nueva').value;
    const nueva2=document.getElementById('cmp_nueva2').value;
    if(!actual){toast('Ingresa tu contraseña actual');return;}
    if(!nueva||nueva.length<6){toast('La contraseña nueva debe tener al menos 6 caracteres');return;}
    if(nueva!==nueva2){toast('Las dos contraseñas nuevas no coinciden');return;}
    try{
      await apiPut('/api/auth/me/password',{currentPassword:actual,newPassword:nueva});
    }catch(err){ toast(err.message==='La contraseña actual no es correcta'?'La contraseña actual no es correcta':'No se pudo cambiar: '+err.message); return; }
    closeModal();
    toast('Contraseña actualizada · úsala la próxima vez que entres');
  }finally{ releaseGuard('confirmCambiarMiPassword'); }
}

/* ============================================================
   CONEXIÓN CON EL SERVIDOR (backend real en Render)
   ============================================================ */
const API_BASE = 'https://candytec-backend.onrender.com';
const BUSY_KEYS={};
function guardDouble(key,safetyMs){
  if(BUSY_KEYS[key]) return true;
  BUSY_KEYS[key]=true;
  // red de seguridad: si algún camino olvida liberar el bloqueo, se libera solo tras este tiempo
  setTimeout(()=>{ BUSY_KEYS[key]=false; }, safetyMs||15000);
  return false;
}
function releaseGuard(key){ BUSY_KEYS[key]=false; }
let AUTH_TOKEN = null;

async function apiFetch(path, opts){
  opts = opts || {};
  const headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  if(AUTH_TOKEN) headers['Authorization'] = 'Bearer '+AUTH_TOKEN;
  let res;
  try{
    res = await fetch(API_BASE+path, Object.assign({}, opts, {headers}));
  }catch(netErr){
    throw new Error('No se pudo conectar con el servidor');
  }
  if(res.status===401){
    if(path==='/api/auth/login'){
      let msg='Credenciales incorrectas';
      try{ const j=await res.json(); msg=j.error||msg; }catch(e){}
      throw new Error(msg);
    }
    doLogout();
    throw new Error('Sesión expirada, vuelve a entrar');
  }
  if(!res.ok){
    let msg='Error del servidor';
    try{ const j=await res.json(); msg=j.error||msg; }catch(e){}
    throw new Error(msg);
  }
  if(res.status===204) return null;
  return res.json();
}
const apiGet = (path)=>apiFetch(path);
const apiPost = (path,body)=>apiFetch(path,{method:'POST',body:JSON.stringify(body)});
const apiPut = (path,body)=>apiFetch(path,{method:'PUT',body:JSON.stringify(body)});
const apiDelete = (path)=>apiFetch(path,{method:'DELETE'});

/* subida real de archivos (PDF de factura, fotos de entrega, comprobantes) */
async function uploadRealFile(file){
  const fd=new FormData();
  fd.append('file', file);
  let res;
  try{
    res=await fetch(API_BASE+'/api/upload', {
      method:'POST',
      headers: AUTH_TOKEN?{'Authorization':'Bearer '+AUTH_TOKEN}:{},
      body: fd,
    });
  }catch(netErr){ throw new Error('No se pudo conectar con el servidor'); }
  if(!res.ok){
    let msg='No se pudo subir el archivo';
    try{ const j=await res.json(); msg=j.error||msg; }catch(e){}
    throw new Error(msg);
  }
  return res.json(); // {url, name}
}
/* maneja el estado visual de un filedrop mientras sube un archivo real */
async function handleFileDrop(el, onDone){
  const file=el.files[0]; if(!file) return;
  const wrap=el.closest('.filedrop');
  const label=wrap.querySelector('.fd-label');
  wrap.style.pointerEvents='none';
  label.textContent='Subiendo...';
  try{
    const up=await uploadRealFile(file);
    wrap.style.borderColor='var(--gold)'; wrap.style.background='var(--gold-soft)';
    label.textContent='✓ '+up.name;
    onDone(up);
  }catch(err){
    label.textContent='Error al subir — click para reintentar';
    toast('No se pudo subir el archivo: '+err.message);
  }finally{
    wrap.style.pointerEvents='';
  }
}

/* fechas que llegan del servidor siempre vienen en UTC (servidor corre en UTC) */
function fmtDateDB(v){
  if(!v) return '—';
  const d=new Date(v);
  if(isNaN(d)) return '—';
  return String(d.getUTCDate()).padStart(2,'0')+'/'+String(d.getUTCMonth()+1).padStart(2,'0')+'/'+d.getUTCFullYear();
}
function fmtDateTimeDB(v){
  if(!v) return '';
  const d=new Date(v);
  if(isNaN(d)) return '';
  const f=String(d.getUTCDate()).padStart(2,'0')+'/'+String(d.getUTCMonth()+1).padStart(2,'0')+'/'+d.getUTCFullYear();
  const h=String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0')+':'+String(d.getUTCSeconds()).padStart(2,'0');
  return f+' '+h;
}
function toISODate(ddmmyyyy){
  if(!ddmmyyyy||ddmmyyyy==='—') return null;
  const p=ddmmyyyy.split('/');
  if(p.length!==3) return null;
  return p[2]+'-'+p[1]+'-'+p[0];
}

/* mapeo: filas del servidor (snake_case) -> objetos que ya usa toda la pantalla */
function mapCliente(row){
  return {id:row.id, nombre:row.nombre, ruc:row.ruc, correo:row.correo||'', telefono:row.telefono||'',
    provincia:row.provincia||'', ciudad:row.ciudad||'', direccion:row.direccion||'', sector:row.sector||'', creadoPor:row.creado_por,
    objetivo:row.objetivo!=null?+row.objetivo:0};
}
function mapPedido(row){
  const o={
    id: row.numero_pedido,
    factura: row.factura||null,
    client: row.cliente, ruc: row.ruc||'',
    product: row.producto||'', desc: row.descripcion||'', qty: row.cantidad||'',
    fechaOrden: fmtDateDB(row.fecha_orden), fechaEntrega: fmtDateDB(row.fecha_entrega),
    fechaCobro: row.fecha_cobro?fmtDateDB(row.fecha_cobro):'',
    formaPago: row.forma_pago||'', ciudad: row.ciudad||'', provincia: row.provincia||'',
    lugar: [row.ciudad,row.provincia].filter(Boolean).join(', '),
    direccionEntrega: row.direccion_entrega||'',
    vendedor: row.vendedor, state: row.estado, recibioNombre: row.recibio_nombre||null,
    history: row.history||[], attach: row.attach||[], products: row.products||[],
    descuento: row.descuento!=null?+row.descuento:0, descuentoMotivo: row.descuento_motivo||'',
    ivaTasa: row.iva_tasa!=null?+row.iva_tasa:15,
    costoTransporte: row.costo_transporte!=null?+row.costo_transporte:0,
    costoEstibaje: row.costo_estibaje!=null?+row.costo_estibaje:0,
    pago: row.pago||null, entregas: row.entregas||[],
  };
  computeTotals(o);
  recalcPago(o);
  return o;
}
function mapProduccion(row){
  return {id:row.id, fecha:fmtDateDB(row.fecha), lote:row.lote||'—', items:row.items||[],
    estado:row.estado, registradoPor:row.registrado_por, creadoEn:row.created_at,
    recibidoPor:row.recibido_por||null, recibidoFecha:row.recibido_fecha?fmtDateTimeDB(row.recibido_fecha):null};
}
function mapSolicitud(row){
  return {id:row.id, tipo:row.tipo, refId: row.tipo==='cliente'?+row.ref_id:row.ref_id, refNombre:row.ref_nombre, campo:row.campo,
    valorNuevo:row.valor_nuevo||'', motivo:row.motivo, solicitante:row.solicitante, fecha:fmtDateTimeDB(row.fecha),
    estado:row.estado, resueltoPor:row.resuelto_por||null};
}
function mapInventario(row){
  return {id:row.id, tipo:row.tipo, nombre:row.nombre, unidad:row.unidad,
    stock:row.stock!=null?+row.stock:0, minimo:row.minimo!=null?+row.minimo:0,
    costoProm:row.costo_prom!=null?+row.costo_prom:undefined};
}
function mapMovimiento(row){
  return {id:row.id, itemId:row.item_id, tipo:row.tipo, cantidad:row.cantidad!=null?+row.cantidad:0,
    motivo:row.motivo, usuario:row.usuario, fecha:row.fecha?fmtDateTimeDB(row.fecha):''};
}

/* guarda en el servidor los campos vigentes de un pedido (se llama tras cada mutación local) */
function syncPedido(o, extra){
  const payload=Object.assign({
    estado:o.state, history:o.history, factura:o.factura, attach:o.attach, pago:o.pago,
    subtotal:o.subtotal, descuento:o.descuento, descuento_motivo:o.descuentoMotivo,
    recibio_nombre:o.recibioNombre, fecha_cobro:toISODate(o.fechaCobro), fecha_entrega:toISODate(o.fechaEntrega),
    products:o.products, direccion_entrega:o.direccionEntrega, entregas:o.entregas||[], iva_tasa:o.ivaTasa, costo_transporte:o.costoTransporte, costo_estibaje:o.costoEstibaje,
  }, extra||{});
  apiPut('/api/pedidos/'+o.id, payload).catch(err=>toast('⚠ No se guardó en el servidor: '+err.message));
}

/* trae todo del servidor y llena los arrays que usa la pantalla */
async function loadAllData(){
  const [clientesR, pedidosR, produccionesR, movimientosR, solicitudesR, inventarioR, catalogoR] = await Promise.all([
    apiGet('/api/clientes'), apiGet('/api/pedidos'), apiGet('/api/producciones'),
    apiGet('/api/movimientos'), apiGet('/api/solicitudes'), apiGet('/api/inventario'), apiGet('/api/catalogo'),
  ]);
  CLIENTES.length=0; clientesR.forEach(r=>CLIENTES.push(mapCliente(r)));
  ORDERS = pedidosR.map(mapPedido);
  PRODUCCIONES.length=0; produccionesR.forEach(r=>PRODUCCIONES.push(mapProduccion(r)));
  MOVIMIENTOS.length=0; movimientosR.forEach(r=>MOVIMIENTOS.push(mapMovimiento(r)));
  SOLICITUDES.length=0; solicitudesR.forEach(r=>SOLICITUDES.push(mapSolicitud(r)));
  INVENTARIO.length=0; inventarioR.forEach(r=>INVENTARIO.push(mapInventario(r)));
  if(catalogoR&&catalogoR.length){ CATALOGO.length=0; catalogoR.forEach(r=>CATALOGO.push(r.nombre)); CATALOGO_IDS=catalogoR; }
}
let CATALOGO_IDS=[];

/* ============================================================
   ACTUALIZACIÓN AUTOMÁTICA — refresca los datos en segundo plano
   sin recargar la página, para que nadie se quede viendo información vieja
   ============================================================ */
const VISTAS_FORMULARIO=['nuevo','produccion','consumo-mp']; // formularios largos: no interrumpir a media escritura
let autoRefreshTimer=null;
async function refrescarDatosSilencioso(){
  if(document.hidden) return; // la pestaña no está visible: no gastar llamadas de más
  if(document.getElementById('overlay')?.classList.contains('open')) return; // hay un modal abierto, no interrumpir
  if(VISTAS_FORMULARIO.includes(currentView)) return; // está llenando un formulario largo, no lo piso
  try{
    await loadAllData();
    renderView();
    buildNav();
  }catch(err){ /* fallo silencioso: se reintenta en el siguiente ciclo, sin molestar a la persona */ }
}
function startAutoRefresh(){
  if(autoRefreshTimer) clearInterval(autoRefreshTimer);
  autoRefreshTimer=setInterval(refrescarDatosSilencioso, 60000); // cada 60 segundos
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) refrescarDatosSilencioso(); });
}

async function doLogin(){
  const user=document.getElementById('li_user').value.trim();
  const pass=document.getElementById('li_pass').value;
  const errEl=document.getElementById('loginError');
  const btn=document.getElementById('loginBtn');
  const loading=document.getElementById('loginLoading');
  errEl.style.display='none';
  if(!user||!pass){errEl.textContent='Ingresa usuario y contraseña.';errEl.style.display='block';return;}
  btn.disabled=true; loading.style.display='block';
  try{
    const data=await apiFetch('/api/auth/login',{method:'POST',body:JSON.stringify({username:user,password:pass})});
    AUTH_TOKEN=data.token;
    localStorage.setItem('ct_token',AUTH_TOKEN);
    localStorage.setItem('ct_user',user);
    ROLES[data.user.username]=buildRoleEntry(data.user);
    currentRole=data.user.username;
    currentView=DEFAULT_VIEW[roleKind()];
    await loadAllData();
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('appRoot').style.display='';
    buildRoleMenu(); paintRole(); buildNav(); renderView();
    startAutoRefresh();
  }catch(err){
    errEl.textContent = err.message==='Contraseña incorrecta'?'Contraseña incorrecta.'
      : err.message==='Usuario no encontrado'?'Usuario no encontrado.'
      : 'No se pudo conectar. Intenta de nuevo.';
    errEl.style.display='block';
  }finally{
    btn.disabled=false; loading.style.display='none';
  }
}
function doLogout(){
  localStorage.removeItem('ct_token'); localStorage.removeItem('ct_user');
  location.reload();
}
async function tryAutoLogin(){
  const savedUser=localStorage.getItem('ct_user');
  const savedToken=localStorage.getItem('ct_token');
  if(!savedUser||!savedToken){ return; }
  AUTH_TOKEN=savedToken;
  try{
    const me=await apiGet('/api/auth/me');
    ROLES[me.username]=buildRoleEntry(me);
    currentRole=me.username;
    currentView=DEFAULT_VIEW[roleKind()];
    await loadAllData();
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('appRoot').style.display='';
    buildRoleMenu(); paintRole(); buildNav(); renderView();
    startAutoRefresh();
  }catch(err){
    localStorage.removeItem('ct_token'); localStorage.removeItem('ct_user');
  }
}

/* ---- init ---- */
tryAutoLogin();
