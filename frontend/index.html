<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Pedidos · CandyTec</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CandyTec">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#D55136">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --ink:#171512;
  --ink-2:#3a362f;
  --paper:#f4f2ec;
  --paper-2:#eae6dc;
  --card:#ffffff;
  --line:#e0dbcf;
  --line-2:#d0c9b8;
  --muted:#8a8474;
  --muted-2:#a9a291;
  --gold:#D55136;
  --gold-deep:#A83B22;
  --gold-soft:#FBEAE4;

  /* state palette */
  --s-creado:#8a8474;
  --s-facturado:#3f74c4;
  --s-revision:#c98a2b;
  --s-lamina:#8256c4;
  --s-produciendo:#199488;
  --s-listo:#4257b8;
  --s-bodega:#2b9ac9;
  --s-ok:#3f74c4;
  --s-entregado:#2f9b57;
  --s-devuelto:#c14444;

  --ok-bg:#e7f3ec; --ok-tx:#1f7a44;
  --warn-bg:#fbeed7; --warn-tx:#9a6a15;
  --bad-bg:#fbe6e6; --bad-tx:#a83232;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--paper);
  color:var(--ink);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.os{font-family:'Oswald',sans-serif;letter-spacing:.3px}

/* ---------- APP SHELL ---------- */
.app{display:grid;grid-template-columns:230px 1fr;grid-template-rows:auto 1fr;grid-template-areas:"top top" "side main";height:100vh;overflow:hidden}

/* topbar */
.topbar{grid-area:top;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:58px;border-bottom:2px solid var(--gold);z-index:20}
.brand{display:flex;align-items:center;gap:11px}
.brand .brand-logo{height:28px;width:auto;display:block}
.brand .brand-tagline{margin-top:2px}
.brand .name{font-family:'Oswald';font-weight:600;font-size:17px;letter-spacing:.5px}
.brand .sub{font-size:10px;color:var(--muted-2);letter-spacing:2px;text-transform:uppercase;margin-top:-3px}

.who{display:flex;align-items:center;gap:12px}
.who .lbl{font-size:11px;color:var(--muted-2);text-transform:uppercase;letter-spacing:1px}
.rolesel{position:relative}
.rolesel button{display:flex;align-items:center;gap:9px;background:#2a2721;border:1px solid #423d34;color:#fff;padding:6px 12px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:13px;transition:.15s}
.rolesel button:hover{background:#332f28;border-color:var(--gold-deep)}
.rolesel .av{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
.rolesel .chev{color:var(--muted-2);font-size:11px}
.rolemenu{position:absolute;top:calc(100% + 8px);right:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.18);width:250px;overflow:hidden;display:none;z-index:40}
.rolemenu.open{display:block}
.rolemenu .ri{display:flex;align-items:center;gap:11px;padding:11px 14px;cursor:pointer;color:var(--ink);border-bottom:1px solid var(--paper-2)}
.rolemenu .ri:last-child{border-bottom:none}
.rolemenu .ri:hover{background:var(--gold-soft)}
.rolemenu .ri .av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
.rolemenu .ri .rn{font-weight:600;font-size:13px}
.rolemenu .ri .rr{font-size:11px;color:var(--muted)}

/* sidebar */
.side{grid-area:side;background:var(--ink);border-right:1px solid #2a2721;padding:16px 12px;overflow-y:auto}
.side .cur-role{background:#242019;border:1px solid #35302733;border-radius:10px;padding:12px;margin-bottom:16px}
.side .cur-role .av{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;margin-bottom:9px}
.side .cur-role .n{color:#fff;font-weight:600;font-size:14px}
.side .cur-role .r{color:var(--gold);font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-top:1px}
.navlabel{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;padding:0 8px;margin:14px 0 7px}
.navitem{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:8px;color:#c9c3b4;cursor:pointer;font-size:13.5px;font-weight:500;margin-bottom:2px;transition:.13s;border:1px solid transparent}
.navitem:hover{background:#242019;color:#fff}
.navitem.active{background:var(--gold);color:var(--ink);font-weight:600}
.navitem .ic{width:18px;text-align:center;font-size:15px}
.navitem .badge{margin-left:auto;background:#332f28;color:var(--gold);font-size:11px;font-weight:700;padding:1px 7px;border-radius:20px;min-width:20px;text-align:center}
.navitem.active .badge{background:var(--ink);color:var(--gold)}

/* main */
.main{grid-area:main;overflow-y:auto;padding:26px 30px 60px}
.pagehead{margin-bottom:22px}
.pagehead h1{font-size:26px;font-weight:600;color:var(--ink)}
.pagehead p{color:var(--muted);font-size:13.5px;margin-top:2px}

/* ---------- COMPONENTS ---------- */
.badge-state{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:4px 11px;border-radius:20px;color:#fff;white-space:nowrap;font-family:'Inter'}
.badge-state .dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.85)}

.btn{display:inline-flex;align-items:center;gap:8px;font-family:'Inter';font-size:13.5px;font-weight:600;padding:9px 16px;border-radius:9px;border:1px solid var(--line-2);background:var(--card);color:var(--ink);cursor:pointer;transition:.14s}
.btn:hover{border-color:var(--gold);background:var(--gold-soft)}
.btn-primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn-primary:hover{background:#000;border-color:#000}
.btn-gold{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.btn-gold:hover{background:var(--gold-deep);border-color:var(--gold-deep);color:#fff}
.btn-sm{padding:6px 12px;font-size:12.5px}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn-ghost:hover{background:var(--paper-2);color:var(--ink)}
.btn-danger{border-color:#e6b9b9;color:var(--bad-tx)}
.btn-danger:hover{background:var(--bad-bg);border-color:#d99}

/* order cards */
.order-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.ocard{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:0;overflow:hidden;cursor:pointer;transition:.15s;display:flex;flex-direction:column}
.ocard:hover{border-color:var(--line-2);box-shadow:0 6px 20px rgba(90,80,50,.09);transform:translateY(-1px)}
.ocard.is-returned{border-color:#e0a0a0;box-shadow:0 0 0 1px #e0a0a0}
.returned-flag{background:var(--s-devuelto);color:#fff;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:6px 16px;text-align:center}
.return-reason{margin-top:8px;font-size:12px;background:var(--bad-bg);border:1px solid #e6b9b9;border-radius:7px;padding:7px 10px;color:var(--bad-tx)}
.ocard .oc-top{padding:14px 16px 12px;border-bottom:1px solid var(--paper-2)}
.ocard .oc-id{font-family:'Oswald';font-weight:600;font-size:15px;color:var(--ink);letter-spacing:.5px}
.ocard .oc-client{font-size:12.5px;color:var(--muted);margin-top:1px}
.ocard .oc-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ocard .oc-body{padding:13px 16px;flex:1}
.ocard .oc-prod{font-weight:600;font-size:14px;color:var(--ink-2)}
.ocard .oc-meta{display:flex;gap:16px;margin-top:9px;flex-wrap:wrap}
.ocard .oc-meta .m{font-size:11.5px;color:var(--muted)}
.ocard .oc-meta .m b{display:block;color:var(--ink-2);font-size:13px;font-weight:600;font-family:'Inter'}
.ocard .oc-foot{padding:10px 16px;background:#faf9f5;border-top:1px solid var(--paper-2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:6px;background:var(--paper-2);color:var(--ink-2)}
.chip.gold{background:var(--gold-soft);color:var(--gold-deep)}
.chip.new{background:#efe4fb;color:#7343b8}
.chip.warn{background:var(--warn-bg);color:var(--warn-tx)}
.chip.candy{background:#fde8f0;color:#b83a6a}
.chip.dipro{background:#e8eefb;color:#3a5db8}
.prod-line select{width:100%;padding:9px 11px;border:1px solid var(--line-2);border-radius:8px;font-family:'Inter';font-size:13.5px;background:#fdfcfa;color:var(--ink);cursor:pointer}
.prod-line select:focus{outline:none;border-color:var(--gold);background:#fff;box-shadow:0 0 0 3px var(--gold-soft)}
.prod-item{margin-bottom:12px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.prod-item:last-child{border-bottom:none}
.pdesc{width:100%;margin-top:6px;padding:8px 11px;border:1px solid var(--line);border-radius:8px;font-family:'Inter';font-size:12.5px;background:#fdfcfa;color:var(--ink-2)}
.pdesc:focus{outline:none;border-color:var(--gold);background:#fff}
.emp-seg{display:flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:var(--card)}
.emp-seg .eseg{padding:9px 14px;font-family:'Inter';font-size:12.5px;font-weight:600;border:none;background:transparent;color:var(--muted);cursor:pointer;transition:.13s;border-right:1px solid var(--line)}
.emp-seg .eseg:last-child{border-right:none}
.emp-seg .eseg.on{background:var(--ink);color:#fff}
/* buscador y tarjeta de cliente */
.client-sug{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#fff;border:1px solid var(--line-2);border-radius:10px;box-shadow:0 10px 26px rgba(0,0,0,.12);z-index:30;display:none;overflow:hidden}
.client-sug .cs-item{display:flex;justify-content:space-between;gap:12px;padding:10px 13px;cursor:pointer;border-bottom:1px solid var(--paper-2);font-size:13px}
.client-sug .cs-item:last-child{border-bottom:none}
.client-sug .cs-item:hover{background:var(--gold-soft)}
.client-sug .cs-item span{color:var(--muted);font-size:12px}
.client-sug .cs-empty{padding:11px 13px;font-size:12.5px;color:var(--muted)}
.client-card{margin-top:10px;background:#faf8f2;border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.client-card .cc-row{display:flex;justify-content:space-between;gap:14px;font-size:12.5px;padding:3px 0;color:var(--muted)}
.client-card .cc-row b{color:var(--ink);font-weight:600;text-align:right}

/* action bar in cards */
.oc-actions{display:flex;gap:7px;margin-left:auto}

/* empty */
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty .ei{font-size:40px;margin-bottom:10px;opacity:.5}
.empty h3{font-family:'Oswald';font-weight:500;color:var(--ink-2);font-size:18px;margin-bottom:4px}

/* ---------- FORM ---------- */
.formwrap{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px;max-width:760px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{margin-bottom:2px}
.field.full{grid-column:1/-1}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line-2);border-radius:9px;font-family:'Inter';font-size:14px;background:#fdfcfa;color:var(--ink);transition:.14s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold);background:#fff;box-shadow:0 0 0 3px var(--gold-soft)}
.field textarea{resize:vertical;min-height:70px}
.field .hint{font-size:11.5px;color:var(--muted);margin-top:5px}
.filedrop{border:2px dashed var(--line-2);border-radius:10px;padding:18px;text-align:center;color:var(--muted);background:#fdfcfa;cursor:pointer;transition:.14s}
.filedrop:hover{border-color:var(--gold);background:var(--gold-soft);color:var(--gold-deep)}
.filedrop .fi{font-size:22px;margin-bottom:5px}

/* cireles toggle */
.cireles-box{grid-column:1/-1;background:#faf8f2;border:1px solid var(--line);border-radius:11px;padding:16px}
.cireles-box .ct{font-size:12px;font-weight:600;color:var(--ink-2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.radio-row{display:flex;gap:12px;flex-wrap:wrap}
.radio-opt{flex:1;min-width:200px;border:1.5px solid var(--line-2);border-radius:10px;padding:13px 15px;cursor:pointer;transition:.14s;background:#fff;display:flex;gap:11px;align-items:flex-start}
.radio-opt:hover{border-color:var(--gold)}
.radio-opt.sel{border-color:var(--gold);background:var(--gold-soft)}
.radio-opt .rc{width:18px;height:18px;border-radius:50%;border:2px solid var(--line-2);flex-shrink:0;margin-top:2px;position:relative}
.radio-opt.sel .rc{border-color:var(--gold-deep)}
.radio-opt.sel .rc::after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--gold-deep)}
.radio-opt .rt{font-weight:600;font-size:13.5px;color:var(--ink)}
.radio-opt .rd{font-size:11.5px;color:var(--muted);margin-top:2px}
.orderbanner{margin-top:11px;padding:11px 13px;background:#efe4fb;border:1px solid #d9c2f2;border-radius:9px;font-size:12.5px;color:#7343b8;display:none;align-items:center;gap:8px}
.orderbanner.show{display:flex}

/* ---------- MODAL / HISTORY ---------- */
.overlay{position:fixed;inset:0;background:rgba(23,21,18,.55);backdrop-filter:blur(2px);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto}
.overlay.open{display:flex}
.modal{background:var(--paper);border-radius:16px;width:100%;max-width:820px;box-shadow:0 24px 60px rgba(0,0,0,.3);overflow:hidden;animation:pop .2s ease}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.99)}to{opacity:1;transform:none}}
.modal-head{background:var(--ink);color:#fff;padding:20px 24px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.modal-head .mh-id{font-family:'Oswald';font-size:21px;font-weight:600;letter-spacing:.5px}
.modal-head .mh-client{color:var(--muted-2);font-size:13px;margin-top:2px}
.modal-close{background:#2a2721;border:1px solid #423d34;color:#fff;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.modal-close:hover{background:#332f28}
.modal-body{padding:22px 24px;max-height:64vh;overflow-y:auto}

.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:20px}
.detail-grid .dg .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.detail-grid .dg .v{font-size:14px;color:var(--ink);font-weight:600;margin-top:2px}

.sec-title{font-family:'Oswald';font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--ink-2);margin:0 0 12px;display:flex;align-items:center;gap:8px}
.sec-title::after{content:'';flex:1;height:1px;background:var(--line)}

/* timeline */
.timeline{position:relative;padding-left:26px;margin-bottom:22px}
.timeline::before{content:'';position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line-2)}
.tl-item{position:relative;padding-bottom:16px}
.tl-item:last-child{padding-bottom:0}
.tl-dot{position:absolute;left:-26px;top:1px;width:16px;height:16px;border-radius:50%;background:var(--card);border:2px solid var(--muted);box-shadow:0 0 0 3px var(--paper)}
.tl-item.done .tl-dot{border-color:var(--s-entregado);background:var(--s-entregado)}
.tl-item.devuelto .tl-dot{border-color:var(--s-devuelto);background:var(--s-devuelto)}
.tl-title{font-weight:600;font-size:13.5px;color:var(--ink)}
.tl-actor{color:var(--muted);font-weight:400}
.tl-time{font-size:12px;color:var(--muted);margin-top:1px}
.tl-note{margin-top:6px;font-size:12.5px;background:#fff;border:1px solid var(--line);border-left:3px solid var(--muted);border-radius:7px;padding:8px 11px;color:var(--ink-2)}
.tl-item.devuelto .tl-note{border-left-color:var(--s-devuelto);background:var(--bad-bg)}

/* attachments */
.attach-list{display:flex;flex-direction:column;gap:8px;margin-bottom:22px}
.attach{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 14px}
.attach .fic{width:34px;height:34px;border-radius:8px;background:var(--gold-soft);color:var(--gold-deep);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.attach .fn{font-weight:600;font-size:13px;color:var(--ink)}
.attach .fm{font-size:11.5px;color:var(--muted)}
.attach .fdl{margin-left:auto;color:var(--muted);font-size:13px;cursor:pointer;padding:5px 10px;border-radius:6px}
.attach .fdl:hover{background:var(--paper-2);color:var(--ink)}

/* kpi row inside modal */
.kpi-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;background:var(--ok-bg);border:1px solid #bfe0cb;border-radius:12px;padding:16px}
.kpi-strip .kv{font-family:'Oswald';font-size:22px;font-weight:600;color:var(--ok-tx)}
.kpi-strip .kl{font-size:11px;color:#4a7d5e;margin-top:1px}

/* ---------- DASHBOARD ---------- */
.dash-section{margin-bottom:28px}
.dash-section > .ds-head{display:flex;align-items:baseline;gap:10px;margin-bottom:13px}
.dash-section > .ds-head h2{font-size:16px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--ink)}
.dash-section > .ds-head .ds-sub{font-size:12.5px;color:var(--muted)}

.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:13px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 17px;position:relative;overflow:hidden}
.stat .sv{font-family:'Oswald';font-size:30px;font-weight:600;color:var(--ink);line-height:1}
.stat .sl{font-size:12px;color:var(--muted);margin-top:5px}
.stat .sbar{position:absolute;left:0;top:0;bottom:0;width:4px}
.stat .strend{font-size:11.5px;font-weight:600;margin-top:6px;display:inline-flex;align-items:center;gap:4px}
.strend.up{color:var(--ok-tx)} .strend.down{color:var(--bad-tx)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:19px}
.panel h3{font-family:'Oswald';font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--ink-2);margin-bottom:15px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}

/* horizontal bars */
.hbar{margin-bottom:13px}
.hbar:last-child{margin-bottom:0}
.hbar .hb-top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px}
.hbar .hb-lbl{color:var(--ink-2);font-weight:500}
.hbar .hb-val{color:var(--muted);font-weight:600}
.hbar .hb-track{height:9px;background:var(--paper-2);border-radius:6px;overflow:hidden}
.hbar .hb-fill{height:100%;border-radius:6px;transition:width .6s cubic-bezier(.3,1,.4,1)}

/* donut */
.donut-wrap{display:flex;align-items:center;gap:22px}
.donut{width:130px;height:130px;flex-shrink:0}
.donut-legend .dl{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:7px}
.donut-legend .dl .sw{width:11px;height:11px;border-radius:3px}

function money(n){return '$'+(+n).toLocaleString('es-EC',{minimumFractionDigits:2,maximumFractionDigits:2})}
function computeTotals(o){
  if(!o.products||!o.products.length){o.subtotal=0;o.descuentoMonto=0;o.iva=0;o.total=0;return;}
  o.subtotal=+(o.products.reduce((a,p)=>a+p.qty*p.price,0)).toFixed(2);
  const d=Math.min(100,Math.max(0,+(o.descuento||0)));
  o.descuentoMonto=+(o.subtotal*d/100).toFixed(2);
  const base=+(o.subtotal-o.descuentoMonto).toFixed(2);
  const tasa=o.ivaTasa!=null?o.ivaTasa:15; // pedidos viejos sin esta propiedad siguen usando 15% como siempre
  o.iva=+(base*(tasa/100)).toFixed(2);      // el IVA se calcula DESPUÉS del descuento
  o.total=+(base+o.iva).toFixed(2);
}
function recalcPago(o){
  if(!o.factura){o.pago=null;return;}
  if(!o.pago) o.pago={vence:'31/07/2026',abonos:[]};
  const ab=(o.pago.abonos||[]).reduce((a,x)=>a+x.monto,0);
  o.pago.cobrado=+ab.toFixed(2);
  o.pago.saldo=Math.max(0,+(o.total-ab).toFixed(2));
  o.pago.estado = o.pago.saldo<=0.005?'pagado':(ab>0?'parcial':'pendiente');
}
function pagoVencido(o){return !!(o.pago&&o.pago.saldo>0&&parseFecha(o.pago.vence)!==null&&parseFecha(o.pago.vence)<HOY)}

  if(!o.pago) return '<span class="pago-badge pb-na">Sin factura</span>';

  if(o.pago.estado==='pagado'&&o.state!=='ENTREGADO') return '<span class="pago-badge pb-pagado">Pagado · pendiente de entrega</span>';
  const map={pagado:['pb-pagado','Pagado'],parcial:['pb-parcial','Parcial'],pendiente:['pb-pendiente','Pendiente']};
  const [c,l]=map[o.pago.estado];
  return '<span class="pago-badge '+c+'">'+l+'</span>';
}

function stateBadge(s,o){
  // un pedido parcial en espera de su siguiente factura se muestra como "POR COMPLETAR",
  // para no confundirlo con un pedido nuevo que nadie ha facturado todavía
  if(o&&esPedidoPorCompletar(o))
    return `<span class="badge-state" style="background:var(--s-produciendo)"><span class="dot"></span>POR COMPLETAR</span>`;
  const st=STATES[s]; if(!st) return '';
  return `<span class="badge-state" style="background:${st.color}"><span class="dot"></span>${st.short}</span>`;
}
function toast(msg){
  const t=document.getElementById('toast');
  document.getElementById('toastMsg').textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2600);
}

/* ---- filtros, búsqueda y ordenamiento (disponibles para todos los usuarios) ---- */
let activeFilter='todos';
let searchQuery='';
let sortMode='none'; // none | entrega-asc | entrega-desc | creacion-asc | creacion-desc
let listCtx=null;    // contexto de la lista visible: {baseFn, cardFn, chips, ...}

// convierte "dd/mm/yyyy" a timestamp; "—" o vacío devuelve null
function parseFecha(f){
  if(!f || f==='—') return null;
  const [d,m,y]=f.split('/').map(Number);
  return new Date(y,m-1,d).getTime();
}
const HOY = new Date().setHours(0,0,0,0);
function hoyStr(){ const d=new Date(); return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear(); }
function ahoraStr(){ return hoyStr()+' '+new Date().toLocaleTimeString('es-EC',{hour12:false}); }
function hoyISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
// ¿el pedido es del año en curso? (las metas de cliente son ANUALES)
function esDeEsteAnio(o){ const f=parseFecha(o.fechaOrden); return f===null?true:new Date(f).getFullYear()===new Date().getFullYear(); }
function ventasAnualesCliente(ruc){
  return ORDERS.filter(o=>o.ruc===ruc&&o.factura&&esDeEsteAnio(o)).reduce((a,o)=>a+valorFacturadoNeto(o),0);
}

function applySearchSort(list){
  let out=list.slice();
  if(activeFilter&&activeFilter!=='todos') out=out.filter(o=>o.state===activeFilter);
  if(searchQuery.trim()){
    const q=searchQuery.trim().toLowerCase();
    out=out.filter(o=>(o.client+' '+o.product+' '+o.id+' '+(o.factura||'')+' '+(o.ruc||'')).toLowerCase().includes(q));
  }
  if(sortMode!=='none'){
    const [campo,dir]=sortMode.split('-');
    const key=campo==='entrega'?'fechaEntrega':'fechaOrden';
    out.sort((a,b)=>{
      const ta=parseFecha(a[key]), tb=parseFecha(b[key]);
      if(ta===null&&tb===null) return 0;
      if(ta===null) return 1;
      if(tb===null) return -1;
      return dir==='asc'?ta-tb:tb-ta;
    });
  }
  return out;
}

  const sorts=[['none','Sin ordenar'],['entrega-asc','Entrega ↑ (más próxima)'],['entrega-desc','Entrega ↓ (más lejana)'],['creacion-desc','Creación ↓ (más reciente)'],['creacion-asc','Creación ↑ (más antigua)']];

/* ============================================================
   INVENTARIO DE BODEGA — ítems, ingresos y salidas
   ============================================================ */
/* ============================================================
   PRODUCCIÓN (jefe registra) · RECEPCIÓN Y DESPACHO (bodega)
   ============================================================ */
function pedidoNum(o){
  if(pedidoMostrarComoParcial(o)) return o.id; // con entregas parciales reales, el identificador es el número de pedido
  return o.factura||o.id;
}
/* ============================================================
   ENTREGAS PARCIALES — un pedido puede facturarse y despacharse en varias partes
   ============================================================ */
function cantidadFacturadaProducto(o,nombre){
  return (o.entregas||[]).reduce((sum,e)=>sum+e.items.filter(i=>i.name===nombre).reduce((a,i)=>a+i.qty,0),0);
}
function cantidadPendienteFacturar(o,nombre){
  const ordenado=(o.products||[]).filter(p=>p.name===nombre).reduce((a,p)=>a+p.qty,0);
  return Math.max(0,+(ordenado-cantidadFacturadaProducto(o,nombre)).toFixed(2));
}
function cantidadEntregadaProducto(o,nombre){
  return (o.entregas||[]).filter(e=>e.estado==='ENTREGADO').reduce((sum,e)=>sum+e.items.filter(i=>i.name===nombre).reduce((a,i)=>a+i.qty,0),0);
}
function tieneEntregas(o){ return !!(o.entregas&&o.entregas.length); }
function pedidoCompleto(o){
  if(!tieneEntregas(o)) return false;
  const nombres=[...new Set((o.products||[]).map(p=>p.name))];
  return nombres.every(nombre=>{
    const total=(o.products||[]).filter(p=>p.name===nombre).reduce((a,p)=>a+p.qty,0);
    return cantidadEntregadaProducto(o,nombre)>=(total-0.005);
  });
}
// "parcial" para mostrar: más de una entrega, o una sola que todavía no cubre todo el pedido
function pedidoMostrarComoParcial(o){
  if(!tieneEntregas(o)) return false;
  if(o.entregas.length>1) return true;
  return (o.products||[]).some(p=>cantidadPendienteFacturar(o,p.name)>0.005);
}
// una entrega con el mismo producto repetido en su lista: dato dañado (bug viejo de líneas duplicadas)
function pedidoTieneEntregaDañada(o){
  if(!tieneEntregas(o)) return false;
  return o.entregas.some(e=>{
    const nombres=e.items.map(it=>it.name);
    return new Set(nombres).size!==nombres.length;
  });
}
/* ============================================================
   VENTAS REALES DE UN PEDIDO — para pedidos sin entregas parciales, el subtotal
   completo YA es lo facturado. Para pedidos que se facturan por partes, solo debe
   contar lo que efectivamente se ha facturado hasta ahora, no el pedido completo.
   ============================================================ */
function valorFacturadoBruto(o){ // en $, sin IVA, antes de descuento
  if(!tieneEntregas(o)) return o.subtotal||0;
  const nombres=[...new Set((o.products||[]).map(p=>p.name))];
  let total=0;
  nombres.forEach(name=>{
    const facturado=cantidadFacturadaProducto(o,name);
    if(facturado<=0) return;
    const lineas=(o.products||[]).filter(p=>p.name===name);
    const qtyLineas=lineas.reduce((a,p)=>a+p.qty,0);
    const valLineas=lineas.reduce((a,p)=>a+p.qty*p.price,0);
    const precioProm=qtyLineas?valLineas/qtyLineas:0;
    total+=facturado*precioProm;
  });
  return total;
}
function valorFacturadoNeto(o){ // sin IVA, después del descuento del pedido
  const bruto=valorFacturadoBruto(o);
  const factor=o.subtotal>0?(1-(o.descuentoMonto||0)/o.subtotal):1;
  return bruto*factor;
}
function valorFacturadoConIva(o){ return valorFacturadoNeto(o)*1.15; }
// lo que FALTA por facturar de un pedido, en $ sin IVA y después del descuento —
// para un pedido nuevo (nada facturado aún) es simplemente su valor completo
function valorPendienteFacturar(o){
  const nombres=[...new Set((o.products||[]).map(p=>p.name))];
  let bruto=0;
  nombres.forEach(name=>{
    const falta=cantidadPendienteFacturar(o,name);
    if(falta<=0) return;
    const lineas=(o.products||[]).filter(p=>p.name===name);
    const qtyLineas=lineas.reduce((a,p)=>a+p.qty,0);
    const valLineas=lineas.reduce((a,p)=>a+p.qty*p.price,0);
    const precioProm=qtyLineas?valLineas/qtyLineas:0;
    bruto+=falta*precioProm;
  });
  const factorDescuento=o.subtotal>0?(1-(o.descuentoMonto||0)/o.subtotal):1;
  return bruto*factorDescuento;
}
function valorPendienteFacturarConIva(o){
  const tasa=o.ivaTasa!=null?o.ivaTasa:15; // respeta el IVA real de cada pedido (15% o 0%)
  return valorPendienteFacturar(o)*(1+tasa/100);
}
// desglose por producto de lo REALMENTE facturado (no de lo pedido), para rankings por producto
function itemsFacturadosPedido(o){
  const nombres=[...new Set((o.products||[]).map(p=>p.name))];
  return nombres.map(name=>{
    const qty=tieneEntregas(o)?cantidadFacturadaProducto(o,name):(o.products||[]).filter(p=>p.name===name).reduce((a,p)=>a+p.qty,0);
    if(qty<=0) return null;
    const lineas=(o.products||[]).filter(p=>p.name===name);
    const qtyLineas=lineas.reduce((a,p)=>a+p.qty,0);
    const valLineas=lineas.reduce((a,p)=>a+p.qty*p.price,0);
    const price=qtyLineas?valLineas/qtyLineas:0;
    return {name,qty,price};
  }).filter(Boolean);
}
// valor en $ (sin IVA, después del descuento del pedido) de UNA entrega específica —
// usa el precio promedio ponderado de cada producto por si tiene líneas a distinto precio (ej. promociones)
function valorEntrega(o,e){
  let bruto=0;
  e.items.forEach(it=>{
    const lineas=(o.products||[]).filter(p=>p.name===it.name);
    const qtyLineas=lineas.reduce((a,p)=>a+p.qty,0);
    const valLineas=lineas.reduce((a,p)=>a+p.qty*p.price,0);
    const precioProm=qtyLineas?valLineas/qtyLineas:0;
    bruto+=it.qty*precioProm;
  });
  const factorDescuento=o.subtotal>0?(1-(o.descuentoMonto||0)/o.subtotal):1;
  return bruto*factorDescuento;
}
// un pedido "por completar": ya tiene al menos una entrega, pero todavía falta entregar todo
function esPedidoPorCompletar(o){
  // "por completar" = todavía queda producto SIN FACTURAR de ese pedido.
  // Un pedido facturado completo (aunque no se haya despachado aún) NO va aquí:
  // sigue su flujo normal por entregar → en tránsito → entregado.
  if(!tieneEntregas(o)) return false;
  if(o.state==='ENTREGADO') return false;
  return (o.products||[]).some(p=>cantidadPendienteFacturar(o,p.name)>0.005);
}
// en qué etapa va el pedido parcial ahora mismo (mirando su entrega en curso)
function etapaActualParcial(o){
  if(!tieneEntregas(o)) return null;
  const enCurso=o.entregas.findIndex(e=>e.estado!=='ENTREGADO');
  if(enCurso===-1){
    // ninguna entrega en curso: si falta facturar, toca la siguiente
    const falta=(o.products||[]).some(p=>cantidadPendienteFacturar(o,p.name)>0.005);
    return falta?{n:o.entregas.length+1,estado:'POR_FACTURAR',label:'Entrega '+(o.entregas.length+1)+' · por facturar'}:null;
  }
  const e=o.entregas[enCurso];
  const lbl={POR_DESPACHAR:'por despachar',EN_TRANSITO:'en tránsito',ENTREGADO:'entregada'}[e.estado]||e.estado;
  return {n:enCurso+1,estado:e.estado,label:'Entrega '+(enCurso+1)+' · '+lbl};
}
// porcentaje entregado del pedido (en unidades), para la barra de avance
function avancePedido(o){
  const total=(o.products||[]).reduce((a,p)=>a+p.qty,0);
  if(!total) return 0;
  const nombres=[...new Set((o.products||[]).map(p=>p.name))];
  const entregado=nombres.reduce((a,name)=>a+cantidadEntregadaProducto(o,name),0);
  return Math.round(entregado/total*100);
}

async function recibirProduccion(id){
  if(guardDouble('recibirProduccion')) return;
  try{
    if(!esBodega()&&!isGerente()){toast('Solo Bodega recibe la producción');return;}
    const p=PRODUCCIONES.find(x=>x.id===id); if(!p||p.estado==='RECIBIDO') return;
    // agrupar por nombre (por si el mismo producto aparece dos veces en el mismo ingreso)
    const agrupado={};
    p.items.forEach(it=>{ agrupado[it.nombre]=(agrupado[it.nombre]||0)+it.qty; });
    let u=0;
    try{
      await Promise.all(Object.entries(agrupado).map(async ([nombre,qty])=>{
        let inv=INVENTARIO.find(x=>x.tipo==='producto_terminado'&&x.nombre===nombre);
        if(!inv){
          const row=await apiPost('/api/inventario',{tipo:'producto_terminado',nombre,unidad:inferUnidad(nombre),stock:0,minimo:0});
          inv=mapInventario(row);
          INVENTARIO.push(inv);
        }
        const nuevoStock=+(inv.stock+qty).toFixed(2);
        const fecha=new Date().toISOString();
        const [,movRow]=await Promise.all([
          apiPut('/api/inventario/'+inv.id,{stock:nuevoStock}),
          apiPost('/api/movimientos',{item_id:inv.id,tipo:'ingreso',cantidad:qty,motivo:'Recepción de producción '+p.fecha+(p.lote&&p.lote!=='—'?' · lote '+p.lote:''),usuario:myName()+' · Bodega',fecha}),
        ]);
        inv.stock=nuevoStock;
        MOVIMIENTOS.push(mapMovimiento(movRow));
        u+=qty;
      }));
      const recibidoFecha=new Date().toISOString();
      await apiPut('/api/producciones/'+p.id,{estado:'RECIBIDO',recibido_por:myName(),recibido_fecha:recibidoFecha});
    }catch(err){ toast('No se pudo recibir en el servidor: '+err.message); return; }
    p.estado='RECIBIDO'; p.recibidoPor=myName(); p.recibidoFecha=ahoraStr();
    renderView();buildNav();
    toast('Producción recibida · +'+u+' unidades al stock de producto terminado');
  }finally{ releaseGuard('recibirProduccion'); }
}

async function despachar(id){
  if(guardDouble('despachar')) return;
  try{
    if(!esBodega()&&!isGerente()){toast('Solo Bodega despacha');return;}
    const o=ORDERS.find(x=>x.id===id); if(!o) return;
    const idx=(o.entregas||[]).findIndex(e=>e.estado==='POR_DESPACHAR');
    const entrega=idx>=0?o.entregas[idx]:null;
    const aDespachar=entrega?entrega.items:(o.products||[]); // compat: pedidos viejos sin entregas registradas
    // agrupar por nombre por si el mismo producto aparece en más de una línea
    const agrupado={};
    aDespachar.forEach(p=>{ agrupado[p.name]=(agrupado[p.name]||0)+p.qty; });
    const faltas=[];
    Object.entries(agrupado).forEach(([nombre,qty])=>{
      const inv=INVENTARIO.find(x=>x.tipo==='producto_terminado'&&x.nombre===nombre);
      if(!inv||inv.stock<qty) faltas.push(nombre+' (hay '+(inv?inv.stock:0)+', se necesitan '+qty+')');
    });
    if(faltas.length){toast('Stock insuficiente: '+faltas.join(' · '));return;}
    try{
      await Promise.all(Object.entries(agrupado).map(async ([nombre,qty])=>{
        const inv=INVENTARIO.find(x=>x.tipo==='producto_terminado'&&x.nombre===nombre);
        const nuevoStock=+(inv.stock-qty).toFixed(2);
        const fecha=new Date().toISOString();
        const [,movRow]=await Promise.all([
          apiPut('/api/inventario/'+inv.id,{stock:nuevoStock}),
          apiPost('/api/movimientos',{item_id:inv.id,tipo:'salida',cantidad:qty,motivo:'Despacho '+o.id+(entrega?' · entrega '+(idx+1)+' ('+entrega.numeroFactura+')':''),usuario:myName()+' · Bodega',fecha}),
        ]);
        inv.stock=nuevoStock;
        MOVIMIENTOS.push(mapMovimiento(movRow));
      }));
    }catch(err){ toast('No se pudo actualizar el stock en el servidor: '+err.message); return; }
    if(entrega) entrega.estado='EN_TRANSITO';
    pushHistory(o,'EN_TRANSITO','Despachado'+(entrega?' (entrega '+(idx+1)+')':'')+'. Salida automática de bodega PT.');
    afterAction('Pedido despachado · stock descontado automáticamente');
  }finally{ releaseGuard('despachar'); }
}

function ordenarInventario(list){
  const arr=list.slice();
  if(invSortMode==='alfa') arr.sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));
  else if(invSortMode==='alfa-z') arr.sort((a,b)=>b.nombre.localeCompare(a.nombre,'es'));
  else if(invSortMode==='stock-desc') arr.sort((a,b)=>b.stock-a.stock);
  else if(invSortMode==='stock-asc') arr.sort((a,b)=>a.stock-b.stock);
  else if(invSortMode==='bajo-primero') arr.sort((a,b)=>(a.stock<a.minimo?0:1)-(b.stock<b.minimo?0:1)||a.nombre.localeCompare(b.nombre,'es'));
  return arr;

    const esIngreso=tipoSigno(tipo)>0;
    const esAjuste=tipo==='ajuste_alza'||tipo==='ajuste_baja';
    const precioEl=document.getElementById('m_precio');
    const precio=precioEl?parseFloat(precioEl.value):null;
    if(!cantidad||cantidad<=0){toast('Ingresa una cantidad válida');return;}
    if(!motivo){toast('El motivo es obligatorio');return;}
    if(esIngreso&&esMP&&!esAjuste&&(!precio||precio<=0)){toast('Ingresa el precio por '+i.unidad+' de la materia prima');return;}
    if(!esIngreso&&cantidad>i.stock){toast('Stock insuficiente: hay '+i.stock+' '+i.unidad);return;}
    let nuevoCosto=i.costoProm;
    if(esIngreso&&esMP&&!esAjuste){
      // costo promedio ponderado
      nuevoCosto=+(((i.stock*(i.costoProm||0))+(cantidad*precio))/(i.stock+cantidad)).toFixed(4);
    }
    const nuevoStock=+(esIngreso?i.stock+cantidad:i.stock-cantidad).toFixed(2);
    const fecha=new Date().toISOString();
    try{
      await apiPut('/api/inventario/'+id,{stock:nuevoStock,costo_prom:nuevoCosto});
      const movRow=await apiPost('/api/movimientos',{item_id:id,tipo,cantidad,motivo,usuario:myName()+' · '+ROLES[currentRole].role,fecha});
      MOVIMIENTOS.push(mapMovimiento(movRow));
    }catch(err){ toast('No se pudo guardar en el servidor: '+err.message); return; }
    i.stock=nuevoStock;
    if(esIngreso&&esMP&&!esAjuste) i.costoProm=nuevoCosto;
    closeModal();renderView();buildNav();
    const low=i.stock<i.minimo;
    toast(tipoLabel(tipo)+' registrado · stock: '+i.stock+' '+i.unidad+(low?' ⚠ bajo mínimo':''));
  }finally{ releaseGuard('confirmMovimiento'); }
}

async function confirmConsumoMP(){
  if(guardDouble('confirmConsumoMP')) return;
  try{
    if(!esProduccion()&&!isGerente()){toast('Solo el Jefe de Producción registra consumo de materias primas');return;}
    const lineasRaw=consumoParte.filter(l=>l.itemId&&(parseFloat(l.qty)||0)>0);
    if(!lineasRaw.length){toast('Selecciona al menos una materia prima con cantidad');return;}
    const motivoBase=document.getElementById('cm_motivo').value.trim()||'Consumo de producción diaria';
    // agrupar por ítem por si la misma materia prima quedó en dos líneas
    const agrupado={};
    lineasRaw.forEach(l=>{ agrupado[l.itemId]=(agrupado[l.itemId]||0)+parseFloat(l.qty); });
    // validar stock disponible antes de tocar nada
    for(const itemId in agrupado){
      const it=INVENTARIO.find(x=>String(x.id)===String(itemId));
      if(!it){toast('Una materia prima seleccionada ya no existe');return;}
      if(agrupado[itemId]>it.stock){toast('Stock insuficiente de '+it.nombre+': hay '+it.stock+' '+it.unidad);return;}
    }
    try{
      await Promise.all(Object.entries(agrupado).map(async ([itemId,cantidad])=>{
        const it=INVENTARIO.find(x=>String(x.id)===String(itemId));
        const nuevoStock=+(it.stock-cantidad).toFixed(2);
        const fecha=new Date().toISOString();
        const [,movRow]=await Promise.all([
          apiPut('/api/inventario/'+it.id,{stock:nuevoStock}),
          apiPost('/api/movimientos',{item_id:it.id,tipo:'consumo',cantidad,motivo:motivoBase,usuario:myName()+' · '+ROLES[currentRole].role,fecha}),
        ]);
        it.stock=nuevoStock;
        MOVIMIENTOS.push(mapMovimiento(movRow));
      }));
    }catch(err){ toast('No se pudo registrar el consumo: '+err.message); return; }
    consumoParte=[{itemId:'',qty:''}];
    renderView(); buildNav();
    toast('Consumo de materias primas registrado · stock actualizado');
  }finally{ releaseGuard('confirmConsumoMP'); }
}

          <td>${m.motivo}</td>

function openEditarMovimiento(id){
  if(!puedeInventario()){toast('Solo Bodega edita movimientos');return;}
  const m=MOVIMIENTOS.find(x=>x.id===id); if(!m) return;

      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="section-note" style="background:var(--warn-bg);border-color:#e8d9a8;color:var(--warn-tx)"><span class="ni">⚠</span><div>Al guardar, el stock actual del ítem se recalcula automáticamente para reflejar el cambio.</div></div>
      <div class="formgrid">
        <div class="field"><label>Tipo</label>
          <select id="em_tipo">
            <option value="ingreso" ${m.tipo==='ingreso'?'selected':''}>▲ Ingreso</option>
            <option value="salida" ${m.tipo==='salida'?'selected':''}>▼ Salida</option>
            <option value="ajuste_alza" ${m.tipo==='ajuste_alza'?'selected':''}>⚖ Ajuste (a favor)</option>
            <option value="ajuste_baja" ${m.tipo==='ajuste_baja'?'selected':''}>⚖ Ajuste (en contra)</option>
            <option value="consumo" ${m.tipo==='consumo'?'selected':''}>▼ Consumo producción</option>
          </select></div>
        <div class="field"><label>Cantidad (${it?it.unidad:''})</label><input id="em_cantidad" type="number" min="0" step="0.01" value="${m.cantidad}"></div>
        <div class="field full"><label>Motivo</label><input id="em_motivo" value="${(m.motivo||'').replace(/"/g,'&quot;')}"></div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-gold" onclick="confirmEditarMovimiento(${id})">Guardar y recalcular stock</button>
    </div>`;

async function confirmEditarMovimiento(id){
  if(guardDouble('confirmEditarMovimiento')) return;
  try{
    if(!puedeInventario()){toast('Solo Bodega edita movimientos');return;}
    const m=MOVIMIENTOS.find(x=>x.id===id); if(!m) return;
    const it=INVENTARIO.find(x=>x.id===m.itemId); if(!it){toast('El ítem de este movimiento ya no existe');return;}
    const nuevoTipo=document.getElementById('em_tipo').value;
    const nuevaCantidad=parseFloat(document.getElementById('em_cantidad').value);
    const nuevoMotivo=document.getElementById('em_motivo').value.trim();
    if(!nuevaCantidad||nuevaCantidad<=0){toast('Ingresa una cantidad válida');return;}
    if(!nuevoMotivo){toast('El motivo es obligatorio');return;}
    // revertir el efecto viejo y aplicar el nuevo sobre el stock actual
    const stockSinElViejo=it.stock-tipoSigno(m.tipo)*m.cantidad;
    const stockConElNuevo=+(stockSinElViejo+tipoSigno(nuevoTipo)*nuevaCantidad).toFixed(2);
    if(stockConElNuevo<0){toast('Ese cambio dejaría el stock en negativo — revisa la cantidad');return;}
    try{
      await apiPut('/api/movimientos/'+id,{tipo:nuevoTipo,cantidad:nuevaCantidad,motivo:nuevoMotivo});
      await apiPut('/api/inventario/'+it.id,{stock:stockConElNuevo});
    }catch(err){ toast('No se pudo guardar el cambio: '+err.message); return; }
    m.tipo=nuevoTipo; m.cantidad=nuevaCantidad; m.motivo=nuevoMotivo;
    it.stock=stockConElNuevo;
    closeModal();renderView();buildNav();
    toast('Movimiento actualizado · stock recalculado: '+it.stock+' '+it.unidad);
  }finally{ releaseGuard('confirmEditarMovimiento'); }
}

let clienteSel=null;
function provChange(){
  const prov=document.getElementById('c_provincia').value;
  const sel=document.getElementById('c_ciudad');
  sel.disabled=false;
  sel.innerHTML='<option value="" disabled selected>Selecciona ciudad…</option>'
    +(PROVINCIAS_EC[prov]||[]).map(c=>`<option value="${c}">${c}</option>`).join('');
}
function clientSearch(v){
  const box=document.getElementById('clientSug');
  clienteSel=null;
  const card=document.getElementById('clientCard'); if(card) card.innerHTML='';
  const q=v.trim().toLowerCase();
  if(!q){box.innerHTML='';box.style.display='none';return;}
  const base=isVendedor()?CLIENTES.filter(c=>c.creadoPor===myName()):CLIENTES;
  const list=base.filter(c=>c.nombre.toLowerCase().includes(q)||c.ruc.includes(q)).slice(0,6);
  if(!list.length){box.innerHTML='<div class="cs-empty">Sin coincidencias en tu cartera. Crea el cliente primero.</div>';box.style.display='block';return;}
  box.innerHTML=list.map(c=>`<div class="cs-item" onclick="pickClient(${c.id})"><b>${c.nombre}</b><span>${c.ruc}</span></div>`).join('');
  box.style.display='block';
}
function pickClient(id){
  const c=CLIENTES.find(x=>x.id===id); if(!c) return;
  clienteSel=c;
  const inp=document.getElementById('f_client_search'); if(inp) inp.value=c.nombre;
  const box=document.getElementById('clientSug'); if(box) box.style.display='none';
  const card=document.getElementById('clientCard');
  if(card) card.innerHTML=`
    <div class="client-card">
      <div class="cc-row"><span>RUC / CI</span><b>${c.ruc}</b></div>
      <div class="cc-row"><span>Ubicación</span><b>${(c.ciudad||'—')+', '+(c.provincia||'—')}</b></div>
      <div class="cc-row"><span>Correo</span><b>${c.correo||'—'}</b></div>
      <div class="cc-row"><span>Teléfono</span><b>${c.telefono||'—'}</b></div>
      <div class="cc-row"><span>Dirección</span><b>${c.direccion||'—'}</b></div>
    </div>`;
  const lugar=document.getElementById('f_lugar');
  if(lugar&&!lugar.value) lugar.value=c.direccion||'';
}
function eliminarCliente(id){
  if(!isGerente()){toast('Solo gerencia puede eliminar clientes');return;}
  const c=CLIENTES.find(x=>x.id===id); if(!c) return;
  const tienePedidos=ORDERS.some(o=>o.ruc===c.ruc);
  closeModal();
  document.getElementById('modal').innerHTML=`
    <div class="modal-head">
      <div><div class="mh-id">Eliminar cliente</div><div class="mh-client">${c.nombre} · ${c.ruc}</div></div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="section-note" style="background:var(--bad-bg);border-color:#e6b9b9;color:var(--bad-tx)"><span class="ni">⚠</span><div>El cliente saldrá de la base. Su RUC quedará libre y <b>cualquier vendedor podrá volver a crearlo</b> desde su perfil.${tienePedidos?' <b>Ojo:</b> este cliente tiene pedidos registrados; su historial de pedidos no se borra.':''}</div></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-danger" onclick="confirmEliminarCliente(${id})">Eliminar cliente</button>
    </div>`;
  document.getElementById('overlay').classList.add('open');
}
async function confirmEliminarCliente(id){
  const idx=CLIENTES.findIndex(x=>x.id===id); if(idx<0) return;
  const nombre=CLIENTES[idx].nombre;
  try{
    await apiDelete('/api/clientes/'+id);
  }catch(err){ toast('No se pudo eliminar en el servidor: '+err.message); return; }
  CLIENTES.splice(idx,1);
  closeModal();renderView();buildNav();
  toast('Cliente '+nombre+' eliminado · su RUC queda libre');
}

async function confirmNuevoCliente(fromForm){
  if(guardDouble('confirmNuevoCliente')) return;
  try{
    const nombre=document.getElementById('c_nombre').value.trim();
    const ruc=document.getElementById('c_ruc').value.trim();
    if(!nombre){toast('Ingresa el nombre del cliente');return;}
    if(!ruc){toast('Ingresa el RUC o CI');return;}
    const dup=CLIENTES.find(c=>c.ruc===ruc);
    if(dup){toast('Ese RUC ya está registrado por '+dup.creadoPor+'. Un cliente no puede estar en dos vendedores.');return;}
    const provincia=document.getElementById('c_provincia').value;
    const ciudad=document.getElementById('c_ciudad').value;
    if(!provincia){toast('Selecciona la provincia');return;}
    if(!ciudad){toast('Selecciona la ciudad');return;}
    const payload={nombre,ruc,
      correo:document.getElementById('c_correo').value.trim(),
      telefono:document.getElementById('c_telefono').value.trim(),
      provincia,ciudad,
      direccion:document.getElementById('c_direccion').value.trim(),
      sector:document.getElementById('c_sector').value.trim(),
      creado_por:myName()};
    let row;
    try{ row=await apiPost('/api/clientes',payload); }
    catch(err){ toast('No se pudo guardar en el servidor: '+err.message); return; }
    const c=mapCliente(row);
    CLIENTES.push(c);
    closeModal();
    toast('Cliente '+nombre+' guardado');
    if(fromForm&&currentView==='nuevo'){pickClient(c.id);}
    else if(currentView==='clientes'){renderView();buildNav();}
    else{buildNav();}
  }finally{ releaseGuard('confirmNuevoCliente'); }
}

          <div class="cob-line"><span>Dirección</span><b style="text-align:right">${c.direccion||'—'}</b></div>

              <input id="obj_${c.id}" type="number" min="0" step="0.01" value="${c.objetivo||0}" style="width:90px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;font-size:12.5px">
              <button class="btn btn-sm btn-ghost" onclick="guardarObjetivo(${c.id})" style="padding:4px 8px">Guardar</button>

        </div>

async function guardarObjetivo(id){
  if(guardDouble('guardarObjetivo',400)) return;
  try{
    const el=document.getElementById('obj_'+id);
    const val=parseFloat(el.value)||0;
    const c=CLIENTES.find(x=>x.id===id); if(!c) return;
    try{
      await apiPut('/api/clientes/'+id,{objetivo:val});
    }catch(err){ toast('No se pudo guardar la meta: '+err.message); return; }
    c.objetivo=val;
    toast('Meta anual de '+c.nombre+' actualizada a '+money(val));
  }finally{ releaseGuard('guardarObjetivo'); }
}

function lineHTML(l,i){
  const opts=CATALOGO.map(p=>`<option value="${p.replace(/"/g,'&quot;')}" ${l.prod===p?'selected':''}>${p}</option>`).join('');
  return `<div class="prod-item">
    <div class="prod-line">
      <select onchange="updLine(${i},'prod',this.value)">
        <option value="" disabled ${!l.prod?'selected':''}>Selecciona un producto…</option>
        ${opts}
      </select>
      <input type="number" min="1" placeholder="Cantidad" title="Cantidad" value="${l.qty}" oninput="updLine(${i},'qty',this.value)">
      <input type="number" min="0" step="0.01" placeholder="Precio unit. $" title="Precio unitario en USD" value="${l.price}" oninput="updLine(${i},'price',this.value)">
      <div class="lsub" id="lsub${i}">$0.00</div>
      <button class="lrm" onclick="rmLine(${i})" title="Quitar producto">✕</button>
    </div>
    <input class="pdesc" placeholder="Descripción del producto (opcional): sabor, presentación, detalle..." value="${(l.desc||'').replace(/"/g,'&quot;')}" oninput="updLine(${i},'desc',this.value)">
  </div>`;
}
function addLine(){
  prodLines.push({prod:'',qty:'',price:'',desc:''});
  document.getElementById('lines').insertAdjacentHTML('beforeend',lineHTML(prodLines[prodLines.length-1],prodLines.length-1));
  updateTotals();
}
function rmLine(i){
  if(prodLines.length<=1){toast('El pedido debe tener al menos un producto');return;}
  prodLines.splice(i,1);
  document.getElementById('lines').innerHTML=prodLines.map((l,j)=>lineHTML(l,j)).join('');
  updateTotals();
}
function updLine(i,k,v){prodLines[i][k]=v;updateTotals();}
let ivaTasa=15; // por defecto 15%, con opción de marcar 0%
function setIvaTasa(v){
  ivaTasa=v;
  const b15=document.getElementById('iva15btn'), b0=document.getElementById('iva0btn');
  const sel='border:2px solid var(--gold);background:var(--gold-bg,rgba(213,81,54,.06));color:var(--ink)';
  const nosel='border:2px solid var(--line);background:transparent;color:var(--muted)';
  const base='flex:1;padding:9px;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer';
  if(b15) b15.style.cssText=base+';'+(v===15?sel:nosel);
  if(b0) b0.style.cssText=base+';'+(v===0?sel:nosel);
  updateTotals();
}
function updateTotals(){
  let sub=0;
  prodLines.forEach((l,i)=>{
    const st=(parseFloat(l.qty)||0)*(parseFloat(l.price)||0);
    sub+=st;
    const el=document.getElementById('lsub'+i);
    if(el) el.textContent=money(st);
  });
  const dEl=document.getElementById('f_dcto');
  const d=Math.min(100,Math.max(0,parseFloat(dEl&&dEl.value)||0));
  const dm=sub*d/100, base=sub-dm, iva=base*(ivaTasa/100);
  const set=(id,val)=>{const e=document.getElementById(id);if(e)e.textContent=val;};
  set('t_sub',money(sub));
  set('t_dctopct',d);
  set('t_dcto','−'+money(dm));
  set('t_base',money(base));
  set('t_iva',money(iva));
  set('t_ivalabel',ivaTasa);
  set('t_tot',money(base+iva));
  const dr=document.getElementById('dctoRows'); if(dr) dr.style.display=d>0?'flex':'none';
  const mw=document.getElementById('motivoWrap'); if(mw) mw.style.display=d>0?'':'none';
}

async function createOrder(){
  if(guardDouble('createOrder')) return;
  try{
    if(!clienteSel){toast('Selecciona un cliente de tu cartera (o créalo primero)');return;}
    const client=clienteSel.nombre;
    const ruc=clienteSel.ruc;
    const products=prodLines
      .filter(l=>l.prod)
      .map(l=>({name:l.prod,qty:parseFloat(l.qty)||0,price:parseFloat(l.price)||0,desc:(l.desc||'').trim()}));
    if(!products.length){toast('Selecciona al menos un producto del catálogo');return;}
    if(products.some(p=>p.qty<=0||p.price<=0)){toast('Cada producto necesita cantidad y precio');return;}
    const fc=document.getElementById('f_cobro').value;
    if(!fc){toast('Ingresa la fecha de cobro');return;}
    const fpago=document.getElementById('f_fpago').value;
    if(!fpago){toast('Selecciona la forma de pago');return;}
    const reqComp=fpago==='Tarjeta de crédito'||fpago==='Cheque posfechado';
    if(reqComp&&!pagoAdjunto){toast('Adjunta la foto del '+(fpago==='Cheque posfechado'?'cheque posfechado':'comprobante de la tarjeta'));return;}
    const d=Math.min(100,Math.max(0,parseFloat(document.getElementById('f_dcto').value)||0));
    const dmotivo=document.getElementById('f_dctomotivo').value.trim();
    if(d>0&&!dmotivo){toast('Escribe el motivo del descuento');return;}
    const fe=document.getElementById('f_entrega').value;
    const fo=document.getElementById('f_orden').value;
    const fechaCobro=fc.split('-').reverse().join('/');
    const o={
      client, ruc, clienteId:clienteSel.id,
      product: (()=>{ const u=[...new Set(products.map(p=>p.name))]; return u[0]+(u.length>1?` (+${u.length-1} más)`:''); })(),
      products,
      descuento:d, descuentoMotivo:d>0?dmotivo:'', ivaTasa,
      formaPago:fpago, fechaCobro,
      desc:document.getElementById('f_desc').value||'—',
      qty: products.reduce((a,p)=>a+p.qty,0)+' unidades',
      fechaOrden: fo?fo.split('-').reverse().join('/'):hoyStr(),
      fechaEntrega: fe?fe.split('-').reverse().join('/'):'—',
      lugar:(clienteSel.ciudad||'—')+', '+(clienteSel.provincia||'—'),
      ciudad:clienteSel.ciudad||'—', provincia:clienteSel.provincia||'—',
      direccionEntrega:document.getElementById('f_lugar').value||clienteSel.direccion||'',
      vendedor:myName(), state:'POR_FACTURAR',
      history:[{s:'POR_FACTURAR',actor:myName()+' · '+ROLES[currentRole].role,t:ahoraStr(),
        note:'Pedido CandyTec creado. '+products.length+' producto(s). Cobro: '+fechaCobro+' · '+fpago+'.'+(d>0?' Descuento '+d+'%: '+dmotivo+'.':'')}],
      attach: [...(reqComp&&pagoAdjunto?[pagoAdjunto]:[]), ...(ordenCompraAdjunto?[ordenCompraAdjunto]:[])],
    };
    computeTotals(o);
    recalcPago(o);
    let row;
    try{
      row=await apiPost('/api/pedidos',{
        cliente:o.client, ruc:o.ruc, producto:o.product, descripcion:o.desc,
        cantidad:o.qty, fecha_orden:fo||null, fecha_entrega:fe||null, fecha_cobro:fc||null,
        forma_pago:o.formaPago, ciudad:o.ciudad, provincia:o.provincia, direccion_entrega:o.direccionEntrega, vendedor:o.vendedor,
        estado:o.state, products:o.products, descuento:o.descuento, descuento_motivo:o.descuentoMotivo, iva_tasa:o.ivaTasa,
        attach:o.attach, history:o.history, subtotal:o.subtotal,
      });
    }catch(err){ toast('No se pudo guardar en el servidor: '+err.message); return; }
    o.id=row.numero_pedido; // el número real lo asigna el servidor, único de verdad
    const id=o.id;
    ORDERS.unshift(o);
    prodLines=[{prod:'',qty:'',price:'',desc:''}];
    clienteSel=null; pagoAdjunto=null; ordenCompraAdjunto=null;
    toast('Pedido '+id+' creado · Total '+money(o.total));
    setView('mis-pedidos');
  }finally{ releaseGuard('createOrder'); }
}

    </div>
    ${modalActions(o)}
  `;

function modalActions(o){
  let acts=[];
  const r=currentRole, s=o.state;
  if(r==='facturacion'&&s==='POR_FACTURAR'){
    if(!tieneEntregas(o)) acts.push(`<button class="btn btn-danger" onclick="returnOrder('${o.id}')">Devolver al vendedor</button>`);
    acts.push(`<button class="btn btn-gold" onclick="openFacturar('${o.id}')">${tieneEntregas(o)?'Facturar siguiente entrega':'Facturar'}</button>`);
  }
  if(currentRole==='gerente_proy')
    acts.push(`<button class="btn btn-ghost" onclick="openEditarProductos('${o.id}')">✏ Editar productos</button>`);
  if(esFacturacion()||isGerente())
    acts.push(`<button class="btn btn-ghost" onclick="openAdjuntarDocumento('${o.id}')">📎 Adjuntar documento</button>`);
  if(r==='bodega'&&s==='POR_ENTREGAR')
    acts.push(`<button class="btn btn-gold" onclick="despachar('${o.id}')">Despachar</button>`);
  if((r==='bodega'||r==='facturacion')&&s==='EN_TRANSITO')
    acts.push(`<button class="btn btn-gold" onclick="openDeliver('${o.id}')">Confirmar entrega</button>`);
  if(isVendedor()&&mine(o)&&s!=='ENTREGADO')
    acts.push(`<button class="btn btn-ghost" onclick="openSolicitud('pedido','${o.id}')">Solicitar modificación</button>`);
  if(o.pago&&o.pago.saldo>0&&isVendedor()&&mine(o))
    acts.push(`<button class="btn" onclick="openAbono('${o.id}')">Registrar pago</button>`);
  if(isGerente())
    acts.push(`<button class="btn btn-ghost" onclick="toast('Exportado a Excel (simulado)')">⇩ Exportar</button>`);
  if(currentRole==='gerente_proy')
    acts.push(`<button class="btn btn-danger" onclick="eliminarPedido('${o.id}')">🗑 Eliminar pedido</button>`);
  if(!acts.length) return '';
  return `<div class="modal-actions">${acts.join('')}</div>`;
}
function closeModal(){document.getElementById('overlay').classList.remove('open');}
document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal();});
function eliminarPedido(id){
  if(currentRole!=='gerente_proy'){toast('Solo tú puedes eliminar pedidos');return;}
  const o=ORDERS.find(x=>x.id===id); if(!o) return;
  closeModal();
  document.getElementById('modal').innerHTML=`
    <div class="modal-head"><div><div class="mh-id">Eliminar pedido</div><div class="mh-client">${pedidoNum(o)} · ${o.client}</div></div><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="section-note" style="background:var(--bad-bg);border-color:#e6b9b9;color:var(--bad-tx)"><span class="ni">⚠</span><div>Esto borra el pedido <b>por completo y de forma permanente</b> — su historial, adjuntos y estado de pago. No afecta el inventario ya movido (si necesitas corregir stock, hazlo desde Movimientos). No se puede deshacer.</div></div>
      <div class="field"><label>Para confirmar, escribe <b>ELIMINAR</b></label><input id="ep_confirm" placeholder="ELIMINAR"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-danger" onclick="confirmEliminarPedido('${o.id}')">Eliminar definitivamente</button>
    </div>`;
  document.getElementById('overlay').classList.add('open');
}
async function confirmEliminarPedido(id){
  if(guardDouble('confirmEliminarPedido')) return;
  try{
    if(currentRole!=='gerente_proy'){toast('Solo tú puedes eliminar pedidos');return;}
    if(document.getElementById('ep_confirm').value.trim()!=='ELIMINAR'){toast('Escribe ELIMINAR para confirmar');return;}
    try{
      await apiDelete('/api/pedidos/'+id);
    }catch(err){ toast('No se pudo eliminar: '+err.message); return; }
    ORDERS=ORDERS.filter(o=>o.id!==id);
    closeModal();renderView();buildNav();
    toast('Pedido eliminado permanentemente');
  }finally{ releaseGuard('confirmEliminarPedido'); }
}

/* ============================================================
   ACTIONS (state transitions)
   ============================================================ */
function pushHistory(o,s,note){
  const now=ahoraStr();
  o.history.push({s, actor:`${ROLES[currentRole].name} · ${ROLES[currentRole].role}`, t:now, note});
  o.state=s;
  o.owner=null;                  // avanzó: el responsable vuelve a derivarse del estado
  o.pendienteCorreccion=false;   // se limpia la marca de devuelto
  syncPedido(o);
}
function afterAction(msg){closeModal();renderView();buildNav();toast(msg);}

function attachFacturaPDF(el){handleFileDrop(el, up=>{facturaAdjunta=up;});}
/* ============================================================

let editLines=[];
let editPedidoId=null;
function editLineHTML(l,i,minQty){
  const opts=CATALOGO.map(p=>`<option value="${p.replace(/"/g,'&quot;')}" ${l.name===p?'selected':''}>${p}</option>`).join('');
  return `<div class="prod-item" id="editline${i}">
    <div class="prod-line">
      <select onchange="updEditLine(${i},'name',this.value)">
        <option value="" disabled ${!l.name?'selected':''}>Selecciona un producto…</option>
        ${opts}
      </select>

function minQtyEditLine(name){

function rmEditLine(i){

  const l=editLines[i];

  if(min>0){toast('No puedes quitar "'+l.name+'" — ya se facturaron '+min+' unidades en una entrega anterior');return;}

function updEditLine(i,k,v){editLines[i][k]=v; if(k!=='desc') renderEditLines(); }
function updateEditTotals(){
  let sub=0;
  editLines.forEach((l,i)=>{

    const el=document.getElementById('elsub'+i); if(el) el.textContent=money(st);

  const oEdit=ORDERS.find(x=>x.id===editPedidoId);
  const tasa=oEdit&&oEdit.ivaTasa!=null?oEdit.ivaTasa:15;
  const iva=sub*(tasa/100);
  const tEl=document.getElementById('edit_total'); if(tEl) tEl.textContent=money(sub+iva);
  const sEl=document.getElementById('edit_subtotal'); if(sEl) sEl.textContent=money(sub);

async function confirmEditarProductos(){
  if(guardDouble('confirmEditarProductos')) return;
  try{
    if(currentRole!=='gerente_proy'){toast('Solo tú puedes editar los productos de un pedido');return;}
    const o=ORDERS.find(x=>x.id===editPedidoId); if(!o) return;
    for(const l of editLines){
      if(!l.name){toast('Selecciona un producto en todas las líneas');return;}
      if(!(parseFloat(l.qty)>0)){toast('La cantidad de "'+l.name+'" debe ser mayor a 0');return;}
      if(!(parseFloat(l.price)>=0)){toast('El precio de "'+l.name+'" no puede estar vacío');return;}
    }
    // ninguna línea puede quedar por debajo de lo ya facturado en entregas anteriores
    const nombresNuevos=[...new Set(editLines.map(l=>l.name))];
    for(const name of nombresNuevos){
      const min=minQtyEditLine(name);
      const totalNuevo=editLines.filter(l=>l.name===name).reduce((a,l)=>a+(parseFloat(l.qty)||0),0);
      if(totalNuevo<min-0.005){toast('"'+name+'" no puede quedar en '+totalNuevo+' — ya se facturaron '+min+' unidades');return;}
    }
    if(tieneEntregas(o)){
      const nombresAntes=[...new Set((o.products||[]).map(p=>p.name))];
      const faltantes=nombresAntes.filter(n=>minQtyEditLine(n)>0&&!nombresNuevos.includes(n));
      if(faltantes.length){toast('No puedes quitar "'+faltantes[0]+'" — ya tiene facturación previa');return;}
    }
    const antes=(o.products||[]).map(p=>p.qty+' '+p.name).join(', ');
    o.products=editLines.map(l=>({name:l.name,qty:+parseFloat(l.qty).toFixed(2),price:+parseFloat(l.price).toFixed(2),desc:l.desc||''}));
    computeTotals(o);
    if(o.pago) recalcPago(o);
    const despues=o.products.map(p=>p.qty+' '+p.name).join(', ');
    o.history.push({s:o.state,actor:myName()+' · Gerente de Proyectos',t:ahoraStr(),note:'Productos del pedido editados por '+myName()+': antes ('+antes+'), ahora ('+despues+').'});
    syncPedido(o);
    closeModal();renderView();buildNav();
    toast('Productos del pedido actualizados');
  }finally{ releaseGuard('confirmEditarProductos'); }
}

function confirmFacturar(id){
  if(guardDouble('confirmFacturar')) return;
  try{
    const o=ORDERS.find(x=>x.id===id);
    const num=document.getElementById('f_numfac').value.trim();
    const fv=document.getElementById('f_vence').value;
    if(!num){toast('Ingresa el número de la factura');return;}
    if(!facturaAdjunta){toast('Adjunta el PDF de la factura para continuar');return;}
    let items=[];
    if(facturaModo==='parcial'){
      const inputs=[...document.querySelectorAll('[id^="fp_qty_"]')];
      for(const inp of inputs){
        const i=inp.id.replace('fp_qty_','');
        const chk=document.getElementById('fp_chk_'+i);
        if(chk&&!chk.checked) continue; // desmarcado: no entra en esta factura
        const qty=parseFloat(inp.value)||0;
        const max=parseFloat(inp.max);
        if(qty<0){toast('La cantidad de "'+inp.dataset.name+'" no puede ser negativa');return;}
        if(qty>max+0.005){toast('"'+inp.dataset.name+'" no puede superar lo pendiente ('+max+')');return;}
        if(qty>0) items.push({name:inp.dataset.name,qty});
      }
      if(!items.length){toast('Marca al menos un producto con cantidad para esta factura');return;}
    }else{
      // completo: todo lo que todavía falta por facturar del pedido (un producto único, no una línea)
      const nombresPend=[...new Set((o.products||[]).map(p=>p.name))];
      items=nombresPend.map(name=>({name,qty:cantidadPendienteFacturar(o,name)})).filter(i=>i.qty>0);
      if(!items.length){toast('Este pedido ya está facturado por completo');return;}
    }
    if(!o.entregas) o.entregas=[];
    const nEntrega=o.entregas.length+1;
    // el PDF queda guardado dentro de su propia entrega, para saber siempre a qué factura corresponde
    const adjEntrega=Object.assign({},facturaAdjunta,{name:'Factura '+num+' (entrega '+nEntrega+') · '+(facturaAdjunta.name||'factura.pdf')});
    o.entregas.push({numeroFactura:num,fecha:hoyStr(),items,estado:'POR_DESPACHAR',registradoPor:myName(),attach:adjEntrega});
    o.factura=num;
    o.attach.push(adjEntrega);
    o.fechaCobro=fv?fv.split('-').reverse().join('/'):(o.fechaCobro||hoyStr());
    // el saldo es uno solo para todo el pedido: si ya existía, se conservan los abonos hechos
    if(!o.pago) o.pago={vence:o.fechaCobro,abonos:[]};
    else o.pago.vence=o.fechaCobro;
    recalcPago(o);
    const n=o.entregas.length;
    const detalle=items.map(i=>i.qty+' '+i.name).join(', ');
    const falta=(o.products||[]).some(p=>cantidadPendienteFacturar(o,p.name)>0.005);
    pushHistory(o,'POR_ENTREGAR','Entrega '+n+' facturada con '+num+' ('+detalle+').'+(falta?' Quedan productos pendientes de facturar en otra entrega.':' Con esto el pedido queda facturado por completo.'));
    afterAction('Factura '+num+' registrada · pasa a Bodega para despacho');
  }finally{ releaseGuard('confirmFacturar'); }
}

/* Mapa determinista de retroceso: a qué estado y responsable regresa un pedido
   cuando el ROL actual lo devuelve. El estado destino es el estado "pendiente de
   acción" del agente anterior, para que aparezca en su bandeja de trabajo. */
const RETURN_TO = {
  facturacion:{state:'POR_FACTURAR', owner:'vendedor', to:'el vendedor'},
};

function returnTarget(o){
  return RETURN_TO[roleKind()] || null;
}
function confirmReturn(id){
  if(guardDouble('confirmReturn')) return;
  try{
    const reason=document.getElementById('r_reason').value.trim();
    if(!reason){toast('Debes escribir el motivo');return;}
    const o=ORDERS.find(x=>x.id===id);
    const target=returnTarget(o);
    if(!target){toast('Este pedido no tiene una etapa anterior a la que regresar');return;}
    const now=ahoraStr();
    o.history.push({s:target.state,actor:`${ROLES[currentRole].name} · ${ROLES[currentRole].role}`,t:now,note:reason,devuelto:true});
    o.state=target.state;
    o.owner=target.owner;          // el responsable pasa al agente anterior
    o.pendienteCorreccion=true;    // se resalta al agente que lo recibe
    syncPedido(o);
    afterAction('Pedido regresado a '+target.to);
  }finally{ releaseGuard('confirmReturn'); }
}

let documentoAdicionalAdjunto=null;
function attachDocumentoAdicional(el){handleFileDrop(el, up=>{documentoAdicionalAdjunto=up;});}
function openAdjuntarDocumento(id){
  if(!esFacturacion()&&!isGerente()){toast('No tienes permiso para adjuntar documentos');return;}
  const o=ORDERS.find(x=>x.id===id); if(!o) return;

      </div>

    </div>`;

}
async function confirmAdjuntarDocumento(id){
  if(guardDouble('confirmAdjuntarDocumento')) return;
  try{
    if(!esFacturacion()&&!isGerente()){toast('No tienes permiso para adjuntar documentos');return;}
    const o=ORDERS.find(x=>x.id===id); if(!o) return;
    const tipo=document.getElementById('doc_tipo').value;
    const otro=document.getElementById('doc_otro').value.trim();
    const etiqueta=tipo==='Otro'?(otro||'Documento adicional'):tipo;
    if(tipo==='Otro'&&!otro){toast('Describe qué tipo de documento es');return;}
    if(!documentoAdicionalAdjunto){toast('Adjunta el archivo para continuar');return;}
    const adj=Object.assign({},documentoAdicionalAdjunto,{name:etiqueta+' · '+(documentoAdicionalAdjunto.name||'archivo')});
    o.attach.push(adj);
    o.history.push({s:o.state,actor:myName()+' · '+(esFacturacion()?'Facturación':'Gerencia'),t:ahoraStr(),note:etiqueta+' adjuntada al pedido.'});
    syncPedido(o);
    closeModal();renderView();
    toast('Documento adjuntado');
  }finally{ releaseGuard('confirmAdjuntarDocumento'); }
}
function confirmAbono(id){
  if(guardDouble('confirmAbono')) return;
  try{
    const o=ORDERS.find(x=>x.id===id);
    const monto=parseFloat(document.getElementById('a_monto').value);
    const metodo=document.getElementById('a_metodo').value;
    if(!monto||monto<=0){toast('Ingresa un monto válido');return;}
    if(monto>o.pago.saldo+0.005){toast('El monto supera el saldo pendiente ('+money(o.pago.saldo)+')');return;}
    if(!abonoAdjunto){toast('Adjunta el comprobante de pago para continuar');return;}
    o.pago.abonos.push({monto,fecha:hoyStr(),metodo,comprobante:abonoAdjunto});
    o.attach.push(abonoAdjunto);
    recalcPago(o);
    syncPedido(o);
    closeModal();renderView();buildNav();
    toast(o.pago.estado==='pagado'?(o.state==='ENTREGADO'?'Factura pagada · el pedido pasó a Completados':'Factura pagada por completo · pasará a Completados al entregarse'):'Abono registrado · saldo '+money(o.pago.saldo));
  }finally{ releaseGuard('confirmAbono'); }
}

const CLIENTE_FIELD_MAP={'Nombre / Razón social':'nombre','RUC / CI':'ruc','Correo':'correo','Teléfono':'telefono','Dirección':'direccion','Sector':'sector'};

    <div class="field"><label>${campo==='Cantidad de un producto'?'Nueva cantidad':'Nuevo precio (USD)'}</label><input id="sol_valor" type="number" min="0" step="${campo==='Cantidad de un producto'?'1':'0.01'}"></div>`;

function renderSolValorField(tipo,id){
  const campo=document.getElementById('sol_campo').value;
  if(tipo==='cliente'){
    const c=CLIENTES.find(x=>x.id===id);
    document.getElementById('solValorWrap').innerHTML=valorNuevoFieldHTML(campo,c||{});

function leerValorNuevo(tipo,id){
  if(tipo==='cliente'){
    const campo=document.getElementById('sol_campo').value;
    if(campo==='Ciudad / Provincia'){
      const ciudad=document.getElementById('sol_ciudad').value;
      const provincia=document.getElementById('sol_provincia').value;
      return ciudad+'|'+provincia;
    }
    return document.getElementById('sol_valor').value.trim();
  }
  // pedido
  const campo=document.getElementById('sol_campo').value;
  if(campo==='Eliminar el pedido') return '';
  if(campo==='Fecha de entrega'){
    return document.getElementById('sol_valor').value||'';
  }
  const o=ORDERS.find(x=>x.id===id);
  const idx=parseInt(document.getElementById('sol_prod_idx').value);
  const prod=o&&o.products?o.products[idx]:null;
  const valor=document.getElementById('sol_valor').value;
  if(!prod||!valor) return '';
  return JSON.stringify({producto:prod.name, idx, valor:parseFloat(valor)});
}
// resuelve a qué línea del pedido corresponde una solicitud, usando el índice guardado.
// si el pedido cambió de líneas desde que se pidió esto (ej. se editó), cae de respaldo
// a buscar por nombre, igual que se hacía antes.
function resolverIdxSolicitudPedido(o,j){
  let idx=j.idx;
  if(idx==null||idx<0||!o.products||!o.products[idx]||o.products[idx].name!==j.producto){
    idx=(o.products||[]).findIndex(p=>p.name===j.producto);
  }
  return idx;
}
async function confirmSolicitud(tipo,id){
  if(guardDouble('confirmSolicitud')) return;
  try{
    const campo=document.getElementById('sol_campo').value;
    const motivo=document.getElementById('sol_motivo').value.trim();
    if(!motivo){toast('Escribe el motivo del cambio');return;}
    const valorNuevo=leerValorNuevo(tipo,id);
    if(campo!=='Eliminar el pedido'&&!valorNuevo){toast('Completa el valor nuevo que propones');return;}
    let refNombre='';
    if(tipo==='cliente'){ const c=CLIENTES.find(x=>x.id===id); refNombre=c?c.nombre:''; }
    else { const o=ORDERS.find(x=>x.id===id); refNombre=o?pedidoNum(o):''; }
    let row;
    try{
      row=await apiPost('/api/solicitudes',{tipo,ref_id:id,ref_nombre:refNombre,campo,valor_nuevo:valorNuevo,motivo,solicitante:myName()});
    }catch(err){ toast('No se pudo enviar la solicitud: '+err.message); return; }
    SOLICITUDES.push(mapSolicitud(row));
    closeModal();renderView();buildNav();
    toast('Solicitud enviada a gerencia para revisión');
  }finally{ releaseGuard('confirmSolicitud'); }
}
function fmtValorNuevo(x){
  if(x.tipo==='cliente'){
    if(x.campo==='Ciudad / Provincia'&&x.valorNuevo.includes('|')){
      const [ciudad,provincia]=x.valorNuevo.split('|');
      return ciudad+', '+provincia;
    }
    return x.valorNuevo;
  }
  if(x.campo==='Eliminar el pedido') return '—';
  if(x.campo==='Fecha de entrega') return x.valorNuevo?x.valorNuevo.split('-').reverse().join('/'):'—';
  try{
    const j=JSON.parse(x.valorNuevo);
    return j.producto+': '+(x.campo==='Cantidad de un producto'?j.valor:money(j.valor));
  }catch(e){ return x.valorNuevo; }
}
function openAprobarSolicitud(id){

        <button class="modal-close" onclick="closeModal()">✕</button>

  // pedido

    // y si de verdad hay que borrar, gerente_proy usa el botón "Eliminar pedido" desde el detalle

    document.getElementById('modal').innerHTML=`

      <div class="modal-body">
        <div class="section-note"><span class="ni">◎</span><div><b>Solicitado por ${x.solicitante}:</b> ${x.motivo}</div></div>
        <div class="section-note" style="background:var(--warn-bg);border-color:#e8d9a8;color:var(--warn-tx)"><span class="ni">⚠</span><div>Por seguridad, eliminar un pedido no se hace desde aquí. Si apruebas esta solicitud, solo queda registrada como aceptada — la eliminación real la hace ${currentRole==='gerente_proy'?'usando el botón "Eliminar pedido" en el detalle del pedido':'exclusivamente Sergio Andrés Espinosa (gerente_proy) desde el detalle del pedido'}.</div></div>

  }
  const o=ORDERS.find(ord=>ord.id===x.refId);
  if(!o){toast('El pedido ya no existe');return;}
  closeModal();
  let previewHTML='';
  if(x.campo==='Fecha de entrega'){
    previewHTML=`<div class="field"><label>Nueva fecha de entrega</label><input id="apr_valor" type="date" value="${x.valorNuevo||''}"></div>`;
  }else{
    let j={}; try{ j=JSON.parse(x.valorNuevo); }catch(e){}
    const idxPrev=resolverIdxSolicitudPedido(o,j);
    const existe=idxPrev!==-1&&idxPrev!=null;
    const duplicado=existe&&(o.products||[]).filter(p=>p.name===j.producto).length>1;

    </div>`;
  document.getElementById('overlay').classList.add('open');
}
async function confirmAprobarSolicitudPedido(id){
  if(guardDouble('confirmAprobarSolicitudPedido')) return;
  try{
    const x=SOLICITUDES.find(s=>s.id===id); if(!x) return;
    const o=ORDERS.find(ord=>ord.id===x.refId);
    if(!o){toast('El pedido ya no existe');return;}

    if(x.campo==='Fecha de entrega'){
      const fecha=document.getElementById('apr_valor').value;
      if(!fecha){toast('Selecciona una fecha');return;}
      const anterior=o.fechaEntrega;
      o.fechaEntrega=fecha.split('-').reverse().join('/');
      nota='Fecha de entrega actualizada de '+anterior+' a '+o.fechaEntrega+' (solicitud aprobada).';
    }else{
      let j={}; try{ j=JSON.parse(x.valorNuevo); }catch(e){}
      const idx=resolverIdxSolicitudPedido(o,j);
      if(idx===-1||idx==null){toast('Ese producto ya no está en el pedido — no se puede aplicar');return;}
      if(x.campo==='Cantidad de un producto'){
        const anterior=o.products[idx].qty;
        o.products[idx].qty=j.valor;
        nota='Cantidad de '+j.producto+' actualizada de '+anterior+' a '+j.valor+' (solicitud aprobada).';
      }else{
        const anterior=o.products[idx].price;
        o.products[idx].price=j.valor;
        nota='Precio de '+j.producto+' actualizado de '+money(anterior)+' a '+money(j.valor)+' (solicitud aprobada).';
      }
      computeTotals(o); recalcPago(o);
    }
    try{
      await apiPut('/api/solicitudes/'+id,{estado:'APROBADA',resuelto_por:myName()});
    }catch(err){ toast('No se pudo aplicar el cambio: '+err.message); return; }
    x.estado='APROBADA'; x.resueltoPor=myName();
    o.history.push({s:o.state,actor:`${ROLES[currentRole].name} · ${ROLES[currentRole].role}`,t:ahoraStr(),note:nota});
    syncPedido(o);
    closeModal();renderView();buildNav();
    toast('Pedido actualizado y solicitud aprobada');
  }finally{ releaseGuard('confirmAprobarSolicitudPedido'); }
}

async function confirmAprobarSolicitud(id){
  if(guardDouble('confirmAprobarSolicitud')) return;
  try{
    const x=SOLICITUDES.find(s=>s.id===id); if(!x) return;
    const c=CLIENTES.find(cl=>cl.id===x.refId); if(!c){toast('El cliente ya no existe');return;}
    const patch={};
    if(x.campo==='Ciudad / Provincia'){
      patch.ciudad=document.getElementById('apr_ciudad').value;
      patch.provincia=document.getElementById('apr_provincia').value;
    }else{
      const key=CLIENTE_FIELD_MAP[x.campo];
      const val=document.getElementById('apr_valor').value.trim();
      if(!val){toast('El valor no puede quedar vacío');return;}
      patch[key]=val;
    }
    try{
      const row=await apiPut('/api/clientes/'+c.id,patch);
      Object.assign(c,mapCliente(row));
      await apiPut('/api/solicitudes/'+id,{estado:'APROBADA',resuelto_por:myName()});
    }catch(err){ toast('No se pudo aplicar el cambio: '+err.message); return; }
    x.estado='APROBADA'; x.resueltoPor=myName();
    closeModal();renderView();buildNav();
    toast('Cliente actualizado y solicitud aprobada');
  }finally{ releaseGuard('confirmAprobarSolicitud'); }
}

function viewDashboard(){

  const activos=DS.filter(o=>o.state!=='ENTREGADO').length;
  const porFacturar=counts.POR_FACTURAR||0;

  const cobradoM=cobList.reduce((a,o)=>a+o.pago.cobrado,0);

  const esteAño=(o)=>{const f=parseFecha(o.fechaOrden); return f===null?true:new Date(f).getFullYear()===new Date().getFullYear();};

    costosLogHTML=`<div class="dash-section">

/* SVG donut */
function donut(pct){
  const r=52, c=2*Math.PI*r, on=c*pct/100;
  return `<svg class="donut" viewBox="0 0 130 130">
    <circle cx="65" cy="65" r="${r}" fill="none" stroke="var(--paper-2)" stroke-width="16"/>
    <circle cx="65" cy="65" r="${r}" fill="none" stroke="var(--s-entregado)" stroke-width="16" stroke-linecap="round"
      stroke-dasharray="${on} ${c-on}" stroke-dashoffset="${c*0.25}" transform="rotate(-90 65 65)"/>
    <text x="65" y="61" text-anchor="middle" style="font-family:Oswald;font-size:24px;font-weight:600;fill:var(--ink)">${pct}%</text>
    <text x="65" y="79" text-anchor="middle" style="font-size:9px;fill:var(--muted)">a tiempo</text>
  </svg>`;
}

    'Ciudad':o.ciudad,'Provincia':o.provincia,'Subtotal':o.subtotal,'Descuento %':o.descuento,'IVA':o.iva,'Total':o.total,

  }));
